[package]
name = "molio-ohos"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[lib]
crate-type = ["staticlib"]

[target.'cfg(target_env = "ohos")'.dependencies]
anyhow = "1.0"
moli-core = { path = "../../moli-core", features = ["molio"] }
moli-fetch = { path = "../../moli-fetch" }
moli-web-mime = { path = "../../moli-web-mime" }
parking_lot = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt", "sync", "time"] }
url = "2.5.7"

[lints]
workspace = true
