[package]
license.workspace = true
name = "moli-page-types"
version = "0.1.0"
edition = "2024"

[features]
test-support = ["moli-disk-pool/test-support"]

[dependencies]
bitflags = "2.11.0"
moli-cookie-jar = { path = "../moli-cookie-jar" }
moli-dom = { path = "../moli-dom" }
moli-disk-pool = { path = "../moli-disk-pool" }
moli-fetch = { path = "../moli-fetch" }
moli-parkable-image = { path = "../moli-parkable-image" }
moli-web-mime = { path = "../moli-web-mime" }
http-auth = { version = "0.1.10", default-features = false }
parking_lot = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
url = "2.5.7"

[dev-dependencies]
moli-disk-pool = { path = "../moli-disk-pool", features = ["test-support"] }

[lints]
workspace = true
