[package]
license.workspace = true
name = "moli-storage-service"
version = "0.1.0"
edition = "2024"
description = "Renderer-neutral Moli storage service and bucket identity"

[dependencies]
moli-header-field = { path = "../moli-header-field" }
anyhow = "1.0.100"
base64 = "0.22.1"
moli-browser-profile = { path = "../moli-browser-profile" }
moli-crypto = { path = "../moli-crypto" }
moli-indexeddb = { path = "../moli-indexeddb" }
moli-opfs = { path = "../moli-opfs" }
moli-storage-key = { path = "../moli-storage-key" }
parking_lot = "0.12"
percent-encoding = "2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[lints]
workspace = true
