[package]
name = "moli-system-fonts"
version = "0.1.0"
edition = "2024"
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"

[target.'cfg(not(target_env = "ohos"))'.dependencies]
fontique = "=0.11.0"

[target.'cfg(target_env = "ohos")'.dependencies]
fontique = { version = "=0.11.0", default-features = false, features = ["std"] }

[target.'cfg(any(all(target_os = "linux", not(target_env = "ohos")), target_os = "freebsd"))'.dependencies]
parking_lot = "0.12"
yeslogic-fontconfig-sys = "=6.0.1"

[target.aarch64-apple-ios.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["alloc", "CFString"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["CTFont"] }
write-fonts = { version = "0.50.0", default-features = false }

[lints]
workspace = true
