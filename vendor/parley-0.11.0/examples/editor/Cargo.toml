[package]
name = "editor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
vello_cpu = { workspace = true, default-features = false, features = ["std", "text"] }
softbuffer = "0.4.6"
anyhow = "1.0.102"
ui-events-winit = "0.3"
ui-events = "0.3"
winit = "0.30.13"
parley = { workspace = true, default-features = true, features = ["bytemuck"] }
bytemuck = { workspace = true }
peniko = { workspace = true, default-features = false, features = ["std"] }
skrifa = { workspace = true }
accesskit = "0.25.0"
accesskit_winit = "0.34.0"

[lints]
workspace = true

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
clipboard-rs = "0.3.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"
