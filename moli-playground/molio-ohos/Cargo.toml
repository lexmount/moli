[package]
name = "molio-ohos"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "3"

[lib]
crate-type = ["staticlib"]

[dependencies]
anyhow = "1.0"
moli-core = { path = "../../moli-core", features = ["molio"] }
moli-fetch = { path = "../../moli-fetch" }
moli-web-mime = { path = "../../moli-web-mime" }
parking_lot = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt", "sync", "time"] }
url = "2.5.7"
