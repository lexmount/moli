<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(name, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(error.name, name, description);
    return;
  }
  assert_unreached(description || `Expected ${name}`);
}

test(function () {
  const face = new FontFace("FixtureFace", "url(fixture.woff2)", {
    style: "italic",
    weight: "700",
    stretch: "condensed",
    variant: "small-caps",
    featureSettings: '"liga" off',
    display: "swap",
  });

  assert_true(face instanceof FontFace);
  assert_equals(FontFace.name, "FontFace");
  assert_equals(face.family, "FixtureFace");
  assert_equals(face.source, "url(fixture.woff2)");
  assert_equals(face.style, "italic");
  assert_equals(face.weight, "700");
  assert_equals(face.stretch, "condensed");
  assert_equals(face.variant, "small-caps");
  assert_equals(face.featureSettings, '"liga" off');
  assert_equals(face.display, "swap");
  assert_equals(face.status, "unloaded");
  assert_true(face.loaded instanceof Promise);
  assert_true(face.load() instanceof Promise);
}, "FontFace exposes constructor metadata and descriptors");

test(function () {
  const face = new FontFace("DefaultFace", "url(default.woff)");

  assert_equals(face.style, "normal");
  assert_equals(face.weight, "normal");
  assert_equals(face.stretch, "normal");
  assert_equals(face.variant, "normal");
  assert_equals(face.featureSettings, "normal");
  assert_equals(face.display, "auto");
}, "FontFace applies default descriptors");

test(function () {
  assert_throws_name("TypeError", () => new FontFace(), "family is required");
  assert_throws_name("TypeError", () => new FontFace("FamilyOnly"), "source is required");
  assert_throws_name("TypeError", () => new FontFace(Symbol("family"), "url(font.woff)"), "family Symbol conversion should throw");
  assert_throws_name("TypeError", () => new FontFace("SymbolSource", Symbol("source")), "source Symbol conversion should throw");
  assert_throws_name(
    "Error",
    () => new FontFace({ toString() { throw new Error("family failed"); } }, "url(font.woff)"),
    "family stringification errors should propagate",
  );
  assert_throws_name(
    "Error",
    () => new FontFace("ThrowingSource", { toString() { throw new Error("source failed"); } }),
    "source stringification errors should propagate",
  );
}, "FontFace constructor uses WebIDL scalar argument conversion for string sources");

promise_test(async function () {
  const face = new FontFace("PromiseFace", "url(promise.woff)");
  const loaded = face.loaded;

  assert_equals(await face.load(), face);
  assert_equals(await loaded, face);
}, "FontFace loaded and load promises resolve with the face");

promise_test(async function () {
  const fonts = document.fonts;
  const ready = fonts.ready;

  assert_true(fonts instanceof FontFaceSet);
  assert_equals(document.fonts, fonts);
  assert_equals(fonts.constructor.name, "FontFaceSet");
  assert_equals(fonts.status, "loaded");
  assert_true(ready instanceof Promise);
  assert_equals(await ready, fonts);
}, "document.fonts exposes a stable loaded FontFaceSet");

test(function () {
  const fonts = document.fonts;
  const face = new FontFace("SetFace", "url(set.woff)");

  fonts.clear();
  assert_equals(fonts.size, 0);
  assert_equals(fonts.add(face), fonts);
  assert_equals(fonts.size, 1);
  assert_true(fonts.has(face));
  fonts.add(face);
  assert_equals(fonts.size, 1);
  assert_true(fonts.delete(face));
  assert_equals(fonts.size, 0);
  assert_false(fonts.delete(face));
  assert_false(fonts.has(face));
  fonts.add(face);
  fonts.clear();
  assert_equals(fonts.size, 0);
}, "FontFaceSet supports setlike add, has, delete, and clear");

test(function () {
  const fonts = document.fonts;
  const first = new FontFace("IterOne", "url(one.woff)");
  const second = new FontFace("IterTwo", "url(two.woff)");
  const forEachFamilies = [];

  fonts.clear();
  fonts.add(first);
  fonts.add(second);
  fonts.forEach(function (value, key, set) {
    assert_equals(value, key);
    assert_equals(set, fonts);
    forEachFamilies.push(value.family);
  });

  assert_array_equals(forEachFamilies, ["IterOne", "IterTwo"]);
  assert_array_equals(Array.from(fonts.keys()).map((face) => face.family), [
    "IterOne",
    "IterTwo",
  ]);
  assert_array_equals(Array.from(fonts.values()).map((face) => face.family), [
    "IterOne",
    "IterTwo",
  ]);
  assert_true(Array.from(fonts.entries()).every(([key, value]) => key === value));
  assert_array_equals(Array.from(fonts).map((face) => face.family), [
    "IterOne",
    "IterTwo",
  ]);
  fonts.clear();
}, "FontFaceSet iteration uses insertion order and setlike key/value identity");

promise_test(async function () {
  const fonts = document.fonts;
  const loadedFaces = await fonts.load("16px sans-serif");

  assert_true(Array.isArray(loadedFaces));
  assert_true(fonts.check("16px sans-serif"));
}, "FontFaceSet load and check expose low-dependency font matching");

test(function () {
  const fonts = document.fonts;

  assert_throws_name("TypeError", () => fonts.load(), "load font is required");
  assert_throws_name("TypeError", () => fonts.check(), "check font is required");
  assert_throws_name("TypeError", () => fonts.load(Symbol("font")), "load font Symbol conversion should throw");
  assert_throws_name("TypeError", () => fonts.check(Symbol("font")), "check font Symbol conversion should throw");
  assert_throws_name(
    "Error",
    () => fonts.load({ toString() { throw new Error("font failed"); } }),
    "load font stringification errors should propagate",
  );
  assert_throws_name(
    "Error",
    () => fonts.check("16px sans-serif", { toString() { throw new Error("text failed"); } }),
    "check optional text stringification errors should propagate",
  );

  assert_true(fonts.check("16px sans-serif", undefined));
}, "FontFaceSet load and check use WebIDL scalar argument conversion");

test(function () {
  const fonts = document.fonts;
  const listener = function () {};

  assert_throws_name("TypeError", () => fonts.addEventListener(), "addEventListener type is required");
  assert_throws_name("TypeError", () => fonts.removeEventListener(), "removeEventListener type is required");
  assert_throws_name("TypeError", () => fonts.addEventListener(Symbol("type"), listener), "addEventListener type Symbol conversion should throw");
  assert_throws_name("TypeError", () => fonts.removeEventListener(Symbol("type"), listener), "removeEventListener type Symbol conversion should throw");
  assert_throws_name(
    "Error",
    () => fonts.addEventListener({ toString() { throw new Error("type failed"); } }, listener),
    "addEventListener type stringification errors should propagate",
  );
  assert_throws_name(
    "Error",
    () => fonts.removeEventListener({ toString() { throw new Error("type failed"); } }, listener),
    "removeEventListener type stringification errors should propagate",
  );
}, "FontFaceSet event listener methods use WebIDL type argument conversion");
</script>
