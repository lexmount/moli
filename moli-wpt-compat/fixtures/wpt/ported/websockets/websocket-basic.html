<script>
function assert_throws_name(expectedName, callback, description) {
  let threw = false;
  try {
    callback();
  } catch (error) {
    threw = true;
    assert_equals(error && error.name, expectedName, description || "thrown error name");
  }
  assert_true(threw, description || ("expected " + expectedName + " to be thrown"));
}

test(function () {
  assert_equals(WebSocket.length, 1, "WebSocket constructor length");
  assert_equals(WebSocket.name, "WebSocket", "WebSocket constructor name");

  const globalDescriptor = Object.getOwnPropertyDescriptor(globalThis, "WebSocket");
  assert_true(!!globalDescriptor, "global WebSocket descriptor should exist");
  assert_equals(globalDescriptor.value, WebSocket, "global descriptor value");
  assert_equals(globalDescriptor.writable, true, "global descriptor writable");
  assert_equals(globalDescriptor.enumerable, false, "global descriptor enumerable");
  assert_equals(globalDescriptor.configurable, true, "global descriptor configurable");

  const prototypeDescriptor = Object.getOwnPropertyDescriptor(WebSocket, "prototype");
  assert_true(!!prototypeDescriptor, "WebSocket.prototype descriptor should exist");
  assert_equals(prototypeDescriptor.value, WebSocket.prototype, "prototype descriptor value");
  assert_equals(prototypeDescriptor.writable, false, "prototype descriptor writable");
  assert_equals(prototypeDescriptor.enumerable, false, "prototype descriptor enumerable");
  assert_equals(prototypeDescriptor.configurable, false, "prototype descriptor configurable");

  const constructorDescriptor =
    Object.getOwnPropertyDescriptor(WebSocket.prototype, "constructor");
  assert_true(!!constructorDescriptor, "WebSocket.prototype.constructor should exist");
  assert_equals(constructorDescriptor.value, WebSocket, "constructor descriptor value");
  assert_equals(constructorDescriptor.writable, true, "constructor descriptor writable");
  assert_equals(constructorDescriptor.enumerable, false, "constructor descriptor enumerable");
  assert_equals(constructorDescriptor.configurable, true, "constructor descriptor configurable");
}, "WebSocket constructor and prototype descriptors match the expected shape");

test(function () {
  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  const socket = new WebSocket("/relative");

  assert_equals(
    socket.url,
    scheme + "//" + location.host + "/relative",
    "relative URLs should normalize against the document URL",
  );
  assert_equals(socket.readyState, WebSocket.CONNECTING, "initial readyState");
  assert_equals(socket.bufferedAmount, 0, "initial bufferedAmount");
  assert_equals(socket.extensions, "", "initial extensions");
  assert_equals(socket.protocol, "", "initial protocol");
  assert_equals(socket.binaryType, "blob", "initial binaryType");

  socket.binaryType = "arraybuffer";
  assert_equals(socket.binaryType, "arraybuffer", "binaryType accepts arraybuffer");

  socket.binaryType = "not-a-valid-binary-type";
  assert_equals(socket.binaryType, "arraybuffer", "unknown binaryType values are ignored");
  assert_throws_js(TypeError, function () {
    socket.binaryType = Symbol("arraybuffer");
  }, "binaryType Symbol conversion should throw TypeError");
  assert_throws_js(RangeError, function () {
    socket.binaryType = { toString() { throw new RangeError("binaryType conversion"); } };
  }, "binaryType stringification errors should propagate");
  assert_equals(
    socket.binaryType,
    "arraybuffer",
    "invalid binaryType writes should preserve the previous value",
  );
}, "WebSocket exposes normalized URL and initial IDL attribute surface");

test(function () {
  assert_throws_js(TypeError, function () {
    new WebSocketStream();
  }, "missing WebSocketStream URL should throw TypeError");
  assert_throws_js(TypeError, function () {
    new WebSocketStream("wss://example.test/socket", true);
  }, "WebSocketStream options should be a dictionary object");
  assert_throws_js(TypeError, function () {
    new WebSocketStream("wss://example.test/socket", { protocols: "chat" });
  }, "WebSocketStream protocols should be a sequence");
  assert_throws_js(TypeError, function () {
    new WebSocketStream("wss://example.test/socket", { protocols: Symbol("chat") });
  }, "WebSocketStream protocols should reject Symbol sequence values");
  assert_throws_js(RangeError, function () {
    new WebSocketStream("wss://example.test/socket", {
      get protocols() {
        throw new RangeError("protocol getter");
      },
    });
  }, "WebSocketStream options getter errors should propagate");
  assert_throws_name("SyntaxError", function () {
    new WebSocketStream("wss://example.test/socket", { protocols: ["bad protocol"] });
  }, "WebSocketStream invalid protocols should throw SyntaxError");
  assert_throws_name("SyntaxError", function () {
    new WebSocketStream("wss://example.test/socket", { protocols: ["chat", "CHAT"] });
  }, "WebSocketStream duplicate protocols should throw SyntaxError");
}, "WebSocketStream constructor parses URL and options through WebIDL boundaries");

test(function () {
  const socket = new WebSocket("wss://example.test/socket");

  for (const [name, value] of [
    ["CONNECTING", 0],
    ["OPEN", 1],
    ["CLOSING", 2],
    ["CLOSED", 3],
  ]) {
    const constructorDescriptor = Object.getOwnPropertyDescriptor(WebSocket, name);
    const prototypeDescriptor = Object.getOwnPropertyDescriptor(WebSocket.prototype, name);

    assert_true(!!constructorDescriptor, name + " constructor descriptor should exist");
    assert_true(!!prototypeDescriptor, name + " prototype descriptor should exist");

    assert_equals(WebSocket[name], value, "constructor constant value for " + name);
    assert_equals(WebSocket.prototype[name], value, "prototype constant value for " + name);
    assert_equals(socket[name], value, "instance inherited constant value for " + name);

    for (const descriptor of [constructorDescriptor, prototypeDescriptor]) {
      assert_equals(descriptor.value, value, name + " descriptor value");
      assert_equals(descriptor.writable, false, name + " descriptor writable");
      assert_equals(descriptor.enumerable, true, name + " descriptor enumerable");
      assert_equals(descriptor.configurable, false, name + " descriptor configurable");
    }
  }
}, "WebSocket constants are readonly enumerable values on the constructor and prototype");

test(function () {
  const socket = new WebSocket("wss://example.test/socket");

  for (const [name, invalidValue] of [
    ["onopen", 1],
    ["onmessage", 2],
    ["onerror", 3],
    ["onclose", 4],
  ]) {
    const descriptor = Object.getOwnPropertyDescriptor(WebSocket.prototype, name);
    assert_true(!!descriptor, name + " descriptor should exist");
    assert_equals(typeof descriptor.get, "function", name + " getter");
    assert_equals(typeof descriptor.set, "function", name + " setter");
    assert_equals(descriptor.enumerable, true, name + " descriptor enumerable");
    assert_equals(descriptor.configurable, true, name + " descriptor configurable");
    assert_false(
      Object.prototype.hasOwnProperty.call(socket, name),
      name + " should resolve through the prototype accessor",
    );

    assert_equals(socket[name], null, name + " should start as null");
    socket[name] = function () {};
    assert_equals(typeof socket[name], "function", name + " should accept callables");
    assert_false(
      Object.prototype.hasOwnProperty.call(socket, name),
      name + " should not become an own property after callable assignment",
    );
    socket[name] = invalidValue;
    assert_equals(socket[name], null, name + " should coerce non-callables to null");
  }
}, "WebSocket event handler attributes accept callables and coerce non-callables to null");

test(function () {
  for (const name of ["wasClean", "code", "reason"]) {
    const descriptor = Object.getOwnPropertyDescriptor(CloseEvent.prototype, name);
    assert_true(!!descriptor, name + " descriptor should exist");
    assert_equals(typeof descriptor.get, "function", name + " getter");
    assert_equals(descriptor.set, undefined, name + " setter");
    assert_equals(descriptor.enumerable, true, name + " descriptor enumerable");
    assert_equals(descriptor.configurable, true, name + " descriptor configurable");
  }

  const event = new CloseEvent("close", {
    wasClean: true,
    code: 1000,
    reason: "\uD800",
  });
  assert_equals(event.wasClean, true, "CloseEvent.wasClean");
  assert_equals(event.code, 1000, "CloseEvent.code");
  assert_equals(event.reason.length, 1, "CloseEvent.reason length");
  assert_equals(
    event.reason.charCodeAt(0).toString(16),
    "d800",
    "CloseEvent.reason should preserve DOMString code units",
  );
}, "CloseEvent exposes readonly prototype accessors and DOMString conversion");
