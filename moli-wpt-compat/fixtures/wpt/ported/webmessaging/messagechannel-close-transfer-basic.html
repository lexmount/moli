<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(expectedName, callback, description) {
  let error = null;
  try {
    callback();
  } catch (thrown) {
    error = thrown;
  }
  assert_true(error !== null, (description || "assert_throws_name") + ": expected an exception");
  assert_equals(error.name, expectedName, (description || "assert_throws_name") + ": unexpected exception name");
}

promise_test(async function () {
  const channel = new MessageChannel();
  const messages = [];
  const complete = new Promise(function (resolve) {
    channel.port1.onmessage = function (event) {
      messages.push(event.data);
      if (event.data === "first") {
        channel.port1.close();
      }
      if (event.data === "second") {
        resolve();
      }
    };
  });

  channel.port2.postMessage("first");
  channel.port2.postMessage("second");

  await complete;
  assert_array_equals(messages, ["first", "second"]);
}, "MessagePort.close during dispatch does not cancel already queued messages");

promise_test(async function () {
  const closedPair = new MessageChannel();
  const transferPair = new MessageChannel();
  const received = [];
  const complete = new Promise(function (resolve) {
    transferPair.port2.onmessage = function (event) {
      received.push({kind: event.data.kind, ports: event.ports.length,
        alias: event.data.port === event.ports[0], isMessagePort: event.ports[0] instanceof MessagePort});
      for (const port of event.ports) port.close();
      if (received.length === 2) resolve();
    };
  });

  try {
    closedPair.port1.close();
    transferPair.port1.postMessage({kind: "closed", port: closedPair.port1}, [closedPair.port1]);
    assert_throws_name("DataCloneError", function () {
      transferPair.port1.postMessage("neutered", [closedPair.port1]);
    }, "successful transfer neuters the original closed port");
    transferPair.port1.postMessage({kind: "peer", port: closedPair.port2}, [closedPair.port2]);
    await complete;
    assert_array_equals(received.map(result => result.kind), ["closed", "peer"]);
    for (const result of received) {
      assert_equals(result.ports, 1);
      assert_true(result.alias, "data and event.ports must share the transferred object");
      assert_true(result.isMessagePort);
    }
  } finally {
    closedPair.port1.close(); closedPair.port2.close();
    transferPair.port1.close(); transferPair.port2.close();
  }
}, "MessagePort.close preserves closed and peer transfer identities until successful transfer");
</script>
