<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
test(function () {
  const initialHref = location.href;
  const initialProtocol = location.protocol;
  const initialLength = history.length;

  for (const invalid of ["", "1invalid:", "!bad", "http bad"]) {
    assert_throws_dom(
      "SyntaxError",
      () => { location.protocol = invalid; },
      `invalid scheme ${JSON.stringify(invalid)} should throw`
    );
  }

  for (const ignored of ["data", "file", "ftp", "custom"]) {
    location.protocol = ignored;
    assert_equals(location.href, initialHref, `${ignored} must not navigate an HTTP document`);
    assert_equals(location.protocol, initialProtocol, `${ignored} must preserve the HTTP protocol`);
  }

  assert_equals(history.length, initialLength, "rejected and ignored assignments should not grow history");
}, "location.protocol rejects invalid schemes and ignores non-HTTP(S) results");
</script>
