<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<div id="root" style="width: 200px; height: 200px; overflow: hidden">
  <div id="target" style="width: 100px; height: 100px">target</div>
  <div id="target2" style="width: 50px; height: 50px">target2</div>
</div>
<script>
function nextTask() {
  return new Promise(resolve => setTimeout(resolve, 0));
}

async function waitUntil(predicate, label) {
  for (let i = 0; i < 20; i++) {
    if (predicate()) {
      return;
    }
    await nextTask();
  }
  assert_true(predicate(), label || "condition should become true");
}

function assert_throws_name(expectedName, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(error.name, expectedName, description);
    return;
  }
  throw new Error(description || "expected exception");
}

test(function () {
  const root = document.getElementById("root");
  const observer = new IntersectionObserver(function () {}, {
    root,
    rootMargin: "10px 20px",
    threshold: [1, 0, 0.5, 0.5],
  });

  assert_true(observer instanceof IntersectionObserver);
  assert_equals(observer.root, root);
  assert_equals(observer.rootMargin, "10px 20px 10px 20px");
  assert_array_equals(Array.from(observer.thresholds), [0, 0.5, 1]);
  observer.disconnect();
}, "IntersectionObserver exposes normalized root, rootMargin, and thresholds");

test(function () {
  const emptyRootMarginObserver = new IntersectionObserver(function () {}, { rootMargin: "" });
  assert_equals(emptyRootMarginObserver.rootMargin, "0px 0px 0px 0px");
  emptyRootMarginObserver.disconnect();

  const whitespaceMarginObserver = new IntersectionObserver(function () {}, {
    rootMargin: " \n\t",
    scrollMargin: "",
  });
  assert_equals(whitespaceMarginObserver.rootMargin, "0px 0px 0px 0px");
  assert_equals(whitespaceMarginObserver.scrollMargin, "0px 0px 0px 0px");
  whitespaceMarginObserver.disconnect();
}, "IntersectionObserver treats empty rootMargin and scrollMargin as zero margins");

test(function () {
  assert_throws_name(
    "TypeError",
    () => new IntersectionObserver(null),
    "callback must be a function",
  );
  assert_throws_name(
    "RangeError",
    () => new IntersectionObserver(function () {}, { threshold: [1.1] }),
    "threshold must be in range",
  );
  for (const member of ["rootMargin", "scrollMargin"]) {
    assert_throws_dom(
      "SyntaxError",
      () => new IntersectionObserver(function () {}, { [member]: "1px 1px 1px 1px 1px" }),
      `${member} must contain one to four values`,
    );
  }
  assert_throws_name(
    "TypeError",
    () => new IntersectionObserver(function () {}, { root: document.createTextNode("root") }),
    "root must be Element or Document",
  );
  assert_true(
    new IntersectionObserver(function () {}, { root: document }) instanceof IntersectionObserver,
    "Document root is accepted",
  );
}, "IntersectionObserver validates constructor arguments");

promise_test(async () => {
  const target = document.getElementById("target");
  let entry = null;
  const observer = new IntersectionObserver(function (entries) {
    entry = entries[0];
  });

  observer.observe(target);
  assert_array_equals(observer.takeRecords(), []);

  await waitUntil(() => entry, "initial entry should be delivered asynchronously");
  assert_equals(entry.target, target);
  assert_equals(typeof entry.isIntersecting, "boolean");
  assert_equals(typeof entry.isVisible, "boolean");
  assert_equals(typeof entry.intersectionRatio, "number");
  assert_equals(typeof entry.time, "number");
  assert_equals(typeof entry.boundingClientRect, "object");
  assert_equals(typeof entry.intersectionRect, "object");
  assert_array_equals(observer.takeRecords(), []);
  observer.disconnect();
}, "IntersectionObserver observe() delivers an asynchronous entry with expected shape");

test(function () {
  const observer = new IntersectionObserver(function () {});

  assert_throws_name(
    "TypeError",
    () => observer.observe(document.createTextNode("target")),
    "observe target must be an Element",
  );
  assert_throws_name(
    "TypeError",
    () => observer.observe(document),
    "observe target must reject Document",
  );
  assert_throws_name(
    "TypeError",
    () => observer.unobserve(document.createTextNode("target")),
    "unobserve target must be an Element",
  );
  assert_throws_name(
    "TypeError",
    () => observer.unobserve(),
    "unobserve target is required",
  );
}, "IntersectionObserver observe/unobserve validate Element targets");

promise_test(async () => {
  const target = document.getElementById("target");
  const target2 = document.getElementById("target2");
  const seenTargets = [];
  const observer = new IntersectionObserver(function (entries) {
    seenTargets.push(...entries.map(entry => entry.target));
  });

  observer.observe(target);
  observer.unobserve(target);
  observer.observe(target2);

  assert_array_equals(observer.takeRecords(), []);
  await waitUntil(() => seenTargets.length === 1, "remaining target should deliver");
  assert_array_equals(seenTargets, [target2]);
  observer.disconnect();
}, "IntersectionObserver.unobserve() removes a pending target before delivery");
</script>
