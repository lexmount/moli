<!doctype html>

<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function parse_reporting_api_body(report) {
  return JSON.parse(report.body)[0];
}

let uniqueNameCounter = 0;

function unique_name(prefix) {
  uniqueNameCounter++;
  return prefix + "-" + Date.now() + "-" + uniqueNameCounter;
}

async function take_csp_reports(token) {
  const response = await fetch(
    "/wpt/runtime/csp/reporting/take?token=" + encodeURIComponent(token),
    { cache: "no-store" },
  );
  assert_equals(response.status, 200, "report take endpoint should be reachable");
  return (await response.json()).reports;
}

async function wait_for_csp_report(token, predicate) {
  for (let attempt = 0; attempt < 40; attempt++) {
    for (const report of await take_csp_reports(token)) {
      const parsed = parse_reporting_api_body(report);
      if (predicate(parsed, report)) {
        return { parsed, report };
      }
    }
    await new Promise(resolve => step_timeout(resolve, 25));
  }
  assert_unreached("timed out waiting for SharedWorker CSP report-to delivery");
}

function shared_worker_outcome(url, options) {
  const worker = new SharedWorker(url, options);
  return new Promise(resolve => {
    worker.onerror = event => resolve({ error: event.message });
    worker.port.onmessage = event => resolve(event.data);
    worker.port.start();
  });
}

promise_test(async function () {
  const token = "sharedworker-report-to-report-only";
  const outcome = await shared_worker_outcome(
    "/wpt/ported/sharedworker/resources/script-response-csp/report-to-worker.js",
    unique_name("response-csp-report-to-fetch"),
  );

  assert_equals(outcome.text, "csp-reporting-target");
  assert_true(
    outcome.events.some(event => event.disposition === "report" &&
      event.effectiveDirective === "connect-src" &&
      event.instance &&
      event.blockedURI.includes("/wpt/runtime/csp/reporting/target.txt")),
    "SharedWorker report-only CSP should dispatch a worker SecurityPolicyViolationEvent",
  );

  const match = await wait_for_csp_report(token, report => {
    return report.type === "csp-violation" &&
      report.body.disposition === "report" &&
      report.body.effectiveDirective === "connect-src" &&
      report.body.blockedURL.includes("/wpt/runtime/csp/reporting/target.txt");
  });
  assert_true(
    match.report.contentType.includes("application/reports+json"),
    "report-to delivery should use Reporting API content type",
  );
  assert_true(
    match.parsed.body.documentURL.includes("/report-to-worker.js"),
    "worker report documentURL should identify the SharedWorker script",
  );
}, "SharedWorker response report-only CSP sends report-to without blocking fetch");
