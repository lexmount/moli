<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<body
  data-top-location-unchanged=""
  data-top-history-unchanged=""
  data-sync=""
  data-timeout=""
>
  <iframe
    id="child"
    src="resources/navigation-child-browsing-context-same-document-result-surface-child.html?mode=push&step=7"
  ></iframe>
</body>
<script>
function wait(ms) {
  return new Promise(function (resolve) {
    setTimeout(resolve, ms);
  });
}

function wait_for_value(read, description) {
  return Promise.race([
    new Promise(function (resolve, reject) {
      const deadline = Date.now() + 1000;
      function poll() {
        const value = read();
        if (value) {
          resolve(value);
          return;
        }
        if (Date.now() >= deadline) {
          reject(new Error("timed out waiting for " + description));
          return;
        }
        setTimeout(poll, 10);
      }
      poll();
    }),
    wait(1100).then(function () {
      throw new Error("timed out waiting for " + description);
    }),
  ]);
}

promise_test(async function () {
  const childUrl = new URL(
    "resources/navigation-child-browsing-context-same-document-result-surface-child.html?mode=push&step=7",
    location.href,
  ).href;
  const sync = await wait_for_value(
    function () {
      return document.body.getAttribute("data-sync");
    },
    "child push sync snapshot",
  );
  const timeout = await wait_for_value(
    function () {
      return document.body.getAttribute("data-timeout");
    },
    "child push timeout snapshot",
  );

  assert_equals(
    document.body.getAttribute("data-top-location-unchanged"),
    "true",
    "child push should keep the top-level location unchanged",
  );
  assert_equals(
    document.body.getAttribute("data-top-history-unchanged"),
    "false",
    "child push should advance the joint history length visible from the top window",
  );
  assert_equals(
    sync,
    "hash=#dest|len=2|committed=false|finished=false|history=null|entry={\"step\":7}|listener=1|property=1|from=" +
      childUrl +
      "|propertyFrom=" +
      childUrl +
      "|navType=push|propertyNavType=push|order=cec:push:" +
      childUrl +
      ",popstate:#dest",
    "same-document child push should expose the expected synchronous result surface",
  );
  assert_equals(
    timeout,
    "hash=#dest|len=2|committed=true|finished=true|history=null|entry={\"step\":7}|listener=1|property=1|from=" +
      childUrl +
      "|propertyFrom=" +
      childUrl +
      "|navType=push|propertyNavType=push|order=cec:push:" +
      childUrl +
      ",popstate:#dest,cec-micro:#dest:null,committed:#dest:true,finished:#dest:true,hashchange:#dest",
    "same-document child push should settle committed/finished and preserve event ordering",
  );
}, "Child browsing context same-document push navigation exposes result promises and event surface locally");
</script>
