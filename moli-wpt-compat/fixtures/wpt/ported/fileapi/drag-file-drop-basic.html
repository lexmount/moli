<!doctype html>
<meta charset="utf-8">
<input id="upload" type="file" style="display:block;width:200px;height:200px">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
const input = document.getElementById("upload");
const events = [];
let phase = "default";
let defaultDropFile = null;
let preventedDropFile = null;
let defaultDropTransfer = null;
let preventedDropTransfer = null;
let finishActions = null;

const actionsFinished = new Promise(function (resolve) {
  finishActions = resolve;
});

window.__finishDragFileDrop = function () {
  finishActions();
};

window.__advanceDragFileDropPhase = function () {
  phase = "prevented";
};

input.addEventListener("drop", function (event) {
  const file = event.dataTransfer.files[0];
  if (phase === "prevented") {
    preventedDropFile = file;
    preventedDropTransfer = event.dataTransfer;
    event.preventDefault();
    events.push(
      "prevented-drop:" +
        event.dataTransfer.files.length +
        ":" +
        file.name +
        ":" +
        file.type +
        ":" +
        file.size +
        ":" +
        file.lastModified +
        ":" +
        input.files.length +
        ":" +
        input.files[0].name,
    );
    return;
  }

  defaultDropFile = file;
  defaultDropTransfer = event.dataTransfer;
  events.push(
    "default-drop:" +
      event.dataTransfer.files.length +
      ":" +
      file.name +
      ":" +
      file.type +
      ":" +
      file.size +
      ":" +
      file.lastModified +
      ":" +
      input.files.length,
  );
});

input.addEventListener("input", function () {
  events.push(
    phase +
      "-input:" +
      input.files.length +
      ":" +
      input.files[0].name +
      ":" +
      input.value,
  );
});

input.addEventListener("change", function () {
  events.push(phase + "-change:" + input.files.length + ":" + input.files[0].name);
});

promise_test(async function () {
  await actionsFinished;
  assert_array_equals(
    events,
    [
      "default-drop:1:drag-upload.txt:text/plain:11:7:0",
      "default-input:1:drag-upload.txt:C:\\fakepath\\drag-upload.txt",
      "default-change:1:drag-upload.txt",
      "prevented-drop:1:blocked-upload.txt:text/plain:14:11:1:drag-upload.txt",
    ],
    "file drop default action should assign files, and preventDefault should preserve selection",
  );
  assert_equals(await defaultDropFile.text(), "drag-upload", "default drop DataTransfer file bytes");
  assert_equals(await preventedDropFile.text(), "blocked-upload", "prevented drop DataTransfer file bytes");
  assert_equals(defaultDropTransfer.files.length, 0, "completed default drop disables its DataTransfer");
  assert_equals(preventedDropTransfer.files.length, 0, "completed prevented drop disables its DataTransfer");
  assert_equals(input.files.length, 1, "prevented drop should not replace the existing selection");
  assert_equals(input.files[0].name, "drag-upload.txt", "existing file name after prevented drop");
  assert_equals(input.files[0].type, "text/plain", "existing file type after prevented drop");
  assert_equals(input.files[0].size, 11, "existing file size after prevented drop");
  assert_equals(input.files[0].lastModified, 7, "existing file lastModified after prevented drop");
  assert_equals(await input.files[0].text(), "drag-upload", "existing file bytes after prevented drop");
  assert_equals(input.value, "C:\\fakepath\\drag-upload.txt", "existing fakepath after prevented drop");
}, "Input.dispatchDragEvent drives file input drop default and preventDefault behavior");
</script>
