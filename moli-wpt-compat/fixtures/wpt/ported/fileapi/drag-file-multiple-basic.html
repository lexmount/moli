<!doctype html>
<meta charset="utf-8">
<input id="upload" type="file" style="display:block;width:200px;height:200px">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
const input = document.getElementById("upload");
const events = [];
let phase = "single";
let multipleDropFiles = null;
let singleSelection = null;
let droppedTransfer = null;
let finishActions = null;

const actionsFinished = new Promise(function (resolve) {
  finishActions = resolve;
});

window.__finishMultipleFileDrop = function () {
  finishActions();
};

window.__enableMultipleFileDropPhase = function () {
  singleSelection = Array.from(input.files).map(file => file.name);
  input.multiple = true;
  phase = "multiple";
};

input.addEventListener("drop", function (event) {
  if (phase === "multiple") {
    multipleDropFiles = Array.from(event.dataTransfer.files);
    droppedTransfer = event.dataTransfer;
  }
  events.push(
    phase +
      "-drop:" +
      event.dataTransfer.files.length +
      ":" +
      Array.from(event.dataTransfer.files).map(file => file.name).join(",") +
      ":" +
      input.files.length,
  );
});

input.addEventListener("input", function () {
  events.push(
    phase +
      "-input:" +
      input.files.length +
      ":" +
      Array.from(input.files).map(file => file.name).join(",") +
      ":" +
      input.value,
  );
});

input.addEventListener("change", function () {
  events.push(
    phase +
      "-change:" +
      input.files.length +
      ":" +
      Array.from(input.files).map(file => file.name).join(","),
  );
});

promise_test(async function () {
  await actionsFinished;
  assert_array_equals(singleSelection, [], "single-file input rejects a multiple-file drag without changing selection");
  assert_array_equals(
    events,
    [
      "multiple-drop:2:alpha.txt,beta.txt:0",
      "multiple-input:2:alpha.txt,beta.txt:C:\\fakepath\\alpha.txt",
      "multiple-change:2:alpha.txt,beta.txt",
    ],
    "single-file input rejects the drag before drop; multiple input accepts both files and emits input/change",
  );
  assert_equals(input.files.length, 2, "multiple input keeps both dropped files");
  assert_equals(input.files[0].name, "alpha.txt", "first multiple file");
  assert_equals(input.files[1].name, "beta.txt", "second multiple file");
  assert_equals(input.files[0].type, "text/plain", "first multiple file type");
  assert_equals(input.files[1].type, "text/plain", "second multiple file type");
  assert_equals(input.files[0].size, 5, "first multiple file size");
  assert_equals(input.files[1].size, 4, "second multiple file size");
  assert_equals(input.files[0].lastModified, 3, "first multiple file lastModified");
  assert_equals(input.files[1].lastModified, 4, "second multiple file lastModified");
  assert_equals(await input.files[0].text(), "alpha", "first multiple file bytes");
  assert_equals(await input.files[1].text(), "beta", "second multiple file bytes");
  assert_equals(await multipleDropFiles[0].text(), "alpha", "drop DataTransfer first file bytes");
  assert_equals(await multipleDropFiles[1].text(), "beta", "drop DataTransfer second file bytes");
  assert_equals(droppedTransfer.files.length, 0, "completed drop disables the retained DataTransfer, while captured Files stay readable");
  assert_equals(input.value, "C:\\fakepath\\alpha.txt", "fakepath reflects first selected file");
}, "Input.dispatchDragEvent respects file input multiple selection semantics");
</script>
