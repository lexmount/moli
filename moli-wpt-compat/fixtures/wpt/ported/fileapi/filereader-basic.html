<script>
function assert_throws_name(expectedName, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(error && error.name, expectedName, description || "unexpected exception name");
    return;
  }
  assert_unreached((description || "assert_throws_name") + ": expected an exception");
}

test(function () {
  const reader = new FileReader();

  assert_true(reader instanceof FileReader);
  assert_equals(FileReader.EMPTY, 0);
  assert_equals(FileReader.LOADING, 1);
  assert_equals(FileReader.DONE, 2);
  assert_equals(reader.readyState, FileReader.EMPTY);
  assert_equals(reader.result, null);
  assert_equals(reader.error, null);
}, "FileReader exposes constants and initial state");

test(function () {
  const reader = new FileReader();
  function listener() {}
  const throwingType = {
    toString() {
      throw new RangeError("type conversion");
    },
  };

  assert_throws_name(
    "TypeError",
    () => reader.addEventListener(),
    "addEventListener type is required"
  );
  assert_throws_name(
    "TypeError",
    () => reader.removeEventListener(),
    "removeEventListener type is required"
  );
  assert_throws_name(
    "TypeError",
    () => reader.addEventListener(Symbol("load"), listener),
    "addEventListener rejects Symbol type"
  );
  assert_throws_name(
    "TypeError",
    () => reader.removeEventListener(Symbol("load"), listener),
    "removeEventListener rejects Symbol type"
  );
  assert_throws_name(
    "RangeError",
    () => reader.addEventListener(throwingType, listener),
    "addEventListener propagates type stringification errors"
  );
  assert_throws_name(
    "RangeError",
    () => reader.removeEventListener(throwingType, listener),
    "removeEventListener propagates type stringification errors"
  );

  reader.addEventListener(undefined, listener);
  reader.removeEventListener(undefined, listener);

  assert_throws_name(
    "TypeError",
    () => reader.addEventListener("load"),
    "addEventListener callback is required"
  );
  assert_throws_name(
    "TypeError",
    () => reader.removeEventListener("load"),
    "removeEventListener callback is required"
  );
  reader.addEventListener("load", null);
  reader.addEventListener("load", undefined);
  reader.removeEventListener("load", null);
  reader.removeEventListener("load", undefined);
}, "FileReader listener arguments follow WebIDL boundary conversion");

test(function () {
  const reader = new FileReader();
  const blob = new Blob(["x"]);
  const throwingEncoding = {
    toString() {
      throw new RangeError("encoding conversion");
    },
  };

  assert_throws_name("TypeError", function () {
    reader.readAsText();
  }, "readAsText should require a blob argument");
  assert_throws_name("TypeError", function () {
    reader.readAsDataURL();
  }, "readAsDataURL should require a blob argument");
  assert_throws_name("TypeError", function () {
    reader.readAsArrayBuffer();
  }, "readAsArrayBuffer should require a blob argument");
  assert_throws_name("TypeError", function () {
    reader.readAsBinaryString();
  }, "readAsBinaryString should require a blob argument");
  assert_throws_name("TypeError", function () {
    reader.readAsText(blob, Symbol("utf-8"));
  }, "readAsText should reject Symbol encoding");
  assert_throws_name("RangeError", function () {
    reader.readAsText(blob, throwingEncoding);
  }, "readAsText should propagate encoding stringification errors");
}, "FileReader read methods parse required blob and optional encoding through WebIDL");

promise_test(async function () {
  const reader = new FileReader();
  const blob = new Blob(["Hello, World!"], { type: "text/plain" });
  const events = [];

  const complete = new Promise(function (resolve) {
    reader.onloadstart = function (event) {
      events.push(event.type + ":" + reader.readyState);
    };
    reader.onprogress = function (event) {
      events.push(event.type + ":" + event.loaded + "/" + event.total);
    };
    reader.onload = function (event) {
      events.push(event.type + ":" + reader.readyState + ":" + reader.result);
    };
    reader.onloadend = function (event) {
      events.push(event.type + ":" + reader.readyState);
      resolve();
    };
  });

  reader.readAsText(blob);
  assert_equals(reader.readyState, FileReader.LOADING);
  await complete;

  assert_array_equals(events, [
    "loadstart:1",
    "progress:13/13",
    "load:2:Hello, World!",
    "loadend:2",
  ]);
}, "FileReader.readAsText completes asynchronously with progress and load events");

promise_test(async function () {
  const reader = new FileReader();
  const blob = new Blob(["test"], { type: "text/plain" });
  const complete = new Promise(function (resolve) {
    reader.onload = resolve;
  });

  reader.readAsDataURL(blob);
  await complete;

  assert_equals(reader.result, "data:text/plain;base64,dGVzdA==");
}, "FileReader.readAsDataURL includes MIME type and base64 body");

promise_test(async function () {
  const reader = new FileReader();
  const blob = new Blob([new Uint8Array([65, 66, 67])]);
  const complete = new Promise(function (resolve) {
    reader.addEventListener("load", resolve);
  });

  reader.readAsArrayBuffer(blob);
  await complete;

  assert_true(reader.result instanceof ArrayBuffer);
  assert_array_equals(Array.from(new Uint8Array(reader.result)), [65, 66, 67]);
}, "FileReader.readAsArrayBuffer exposes bytes and addEventListener load callbacks");
</script>
