<!doctype html>
<meta charset="utf-8">
<div id="dropzone" style="width:200px;height:200px">drop</div>
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
const dropzone = document.getElementById("dropzone");
let resolveDrop, rejectDrop;
const dropPromise = new Promise((resolve, reject) => {
  resolveDrop = resolve;
  rejectDrop = reject;
});

function item_string(item) {
  return new Promise(resolve => item.getAsString(resolve));
}
function entry_file(entry) {
  return new Promise(resolve => entry.file(resolve));
}
function read_entries(reader) {
  return new Promise(resolve => reader.readEntries(resolve));
}

dropzone.addEventListener("dragover", event => event.preventDefault());
dropzone.addEventListener("drop", event => {
  event.preventDefault();
  try {
    const dropped = event.dataTransfer;
    assert_equals(dropped.items.length, 4, "mixed payload exposes all item entries during drop");
    assert_array_equals(Array.from(dropped.types), ["text/plain", "text/html", "Files"],
      "types include string MIME types followed by Files");
    assert_equals(dropped.files.length, 1, "only real file payloads appear in files");
    const file = dropped.files[0];
    assert_equals(file.name, "report.txt", "FileList file name");
    assert_equals(file.type, "text/plain", "FileList file type");
    assert_equals(file.lastModified, 21, "FileList file lastModified");

    const [plain, html, fileItem, directoryItem] = Array.from(dropped.items);
    assert_equals(plain.kind, "string", "plain item kind");
    assert_equals(plain.type, "text/plain", "plain item type");
    assert_equals(plain.getAsFile(), null, "string item does not expose a File");
    assert_equals(plain.webkitGetAsEntry(), null, "string item does not expose an entry");
    assert_equals(html.kind, "string", "HTML item kind");
    assert_equals(html.type, "text/html", "HTML item type");
    assert_equals(fileItem.kind, "file", "file item kind");
    assert_equals(fileItem.type, "text/plain", "file item type");
    assert_equals(fileItem.getAsFile(), file, "file item shares the FileList wrapper");
    const fileEntry = fileItem.webkitGetAsEntry();
    assert_true(fileEntry instanceof FileSystemFileEntry, "file item exposes a file entry");
    assert_equals(fileEntry.fullPath, "/report.txt", "file entry fullPath");
    assert_equals(directoryItem.kind, "file", "directory item kind");
    assert_equals(directoryItem.type, "", "directory item has empty MIME type");
    assert_equals(directoryItem.getAsFile(), null, "directory item does not expose a File");
    const directoryEntry = directoryItem.webkitGetAsEntry();
    assert_true(directoryEntry instanceof FileSystemDirectoryEntry,
      "directory item exposes a directory entry");
    assert_equals(directoryEntry.fullPath, "/bundle", "directory entry fullPath");

    // Capture eligible callbacks and durable File/Entry objects during dispatch.
    resolveDrop({dropped, file, fileEntry, directoryEntry,
      items: [plain, html, fileItem, directoryItem],
      plainText: item_string(plain), htmlText: item_string(html)});
  } catch (error) {
    rejectDrop(error);
  }
});

promise_test(async () => {
  const payload = await dropPromise;
  const [plain, html] = await Promise.all([payload.plainText, payload.htmlText]);
  assert_equals(plain, "plain payload", "captured plain string survives disassociation");
  assert_equals(html, "<b>html payload</b>", "captured HTML string survives disassociation");
  assert_equals(await payload.file.text(), "file payload", "captured File preserves bytes");
  const entryBackedFile = await entry_file(payload.fileEntry);
  assert_equals(await entryBackedFile.text(), "file payload", "file entry materializes the same bytes");
  const children = await read_entries(payload.directoryEntry.createReader());
  assert_equals(children.length, 1, "directory entry exposes its child file");
  assert_equals(children[0].name, "inside.txt", "directory child file name");
  assert_equals(children[0].fullPath, "/bundle/inside.txt", "directory child fullPath");
  const childFile = await entry_file(children[0]);
  assert_equals(await childFile.text(), "inside payload", "directory child file bytes");

  assert_equals(payload.dropped.items.length, 0, "saved item list is disabled after drop");
  assert_equals(payload.dropped.files.length, 0, "saved FileList becomes empty");
  assert_equals(payload.dropped.types.length, 0, "saved transfer has no current types");
  assert_equals(payload.dropped.getData("text/plain"), "", "saved transfer cannot read data");
  for (const item of payload.items) {
    assert_equals(item.kind, "", "saved item metadata is disabled");
    assert_equals(item.type, "", "saved item type is disabled");
    assert_equals(item.getAsFile(), null, "saved item cannot reveal a File");
    assert_equals(item.webkitGetAsEntry(), null, "saved item cannot reveal an Entry");
  }
}, "Input.dispatchDragEvent preserves captured mixed payloads and retires event views");
</script>
