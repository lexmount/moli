<!doctype html>
<meta charset="utf-8">
<div id="target" style="width:200px;height:200px"></div>
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
const target = document.getElementById("target");
const events = [];
let firstDataTransfer = null;

const dropped = new Promise(function (resolve) {
  target.addEventListener("dragenter", function (event) {
    firstDataTransfer = event.dataTransfer;
    events.push(
      "dragenter:" +
        event.dataTransfer.getData("text") +
        ":" +
        (event.dataTransfer === firstDataTransfer),
    );
  });

  target.addEventListener("dragover", function (event) {
    event.dataTransfer.setData("text", "mutated-before-cancel");
    events.push(
      "dragover:" +
        event.dataTransfer.getData("text") +
        ":" +
        (event.dataTransfer === firstDataTransfer),
    );
  });

  target.addEventListener("dragCancel", function (event) {
    events.push("dragCancel:" + event.dataTransfer.getData("text"));
  });

  target.addEventListener("drop", function (event) {
    events.push(
      "drop:" +
        event.dataTransfer.getData("text") +
        ":" +
        (event.dataTransfer === firstDataTransfer),
    );
    setTimeout(resolve, 0);
  });
});

promise_test(async function () {
  await dropped;
  assert_equals(firstDataTransfer.items.length, 0, "saved dragenter view is disabled");
  assert_equals(firstDataTransfer.types.length, 0, "cancel does not reactivate the old view");
  assert_equals(firstDataTransfer.getData("text"), "", "old payload stays inaccessible");
  assert_array_equals(
    events,
    [
      "dragenter::true",
      "dragover::false",
      "drop:fresh-after-cancel:false",
    ],
    "dragCancel should clear the active DataTransfer without dispatching a DOM event",
  );
}, "Input.dispatchDragEvent dragCancel clears the active drag session");
</script>
