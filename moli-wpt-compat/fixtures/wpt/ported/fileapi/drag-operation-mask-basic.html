<!doctype html>
<meta charset="utf-8">
<textarea id="target" style="display:block;width:200px;height:200px"></textarea>
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
const target = document.getElementById("target");
const events = [];
let phase = "none";
let overrideDropEffect = null;
let expectedDrops = 0;

function shouldRecordModifierKeys() {
  return phase === "modifiers" ||
    phase === "modifierSelection" ||
    phase === "modifierPrecedence";
}

function modifierState(event) {
  return [
    event.altKey,
    event.ctrlKey,
    event.metaKey,
    event.shiftKey,
  ].join(",");
}

function resetTargetValue() {
  target.value = "hello world";
  target.focus();
  target.setSelectionRange(6, 11);
}

window.__setupDragOperationMaskPhase = function (nextPhase, dropEffect) {
  phase = nextPhase;
  overrideDropEffect = dropEffect || null;
  resetTargetValue();
};

resetTargetValue();

const complete = new Promise(function (resolve) {
  target.addEventListener("dragenter", function (event) {
    if (shouldRecordModifierKeys()) {
      events.push(phase + "-enter-keys:" + modifierState(event));
    }
    events.push(
      phase +
        "-enter:" +
        event.dataTransfer.dropEffect +
        ":" +
        event.dataTransfer.effectAllowed,
    );
  });

  target.addEventListener("dragover", function (event) {
    if (shouldRecordModifierKeys()) {
      events.push(phase + "-over-keys:" + modifierState(event));
    }
    if (overrideDropEffect !== null) {
      event.dataTransfer.dropEffect = overrideDropEffect;
    }
    events.push(
      phase +
        "-over:" +
        event.dataTransfer.dropEffect +
        ":" +
        event.dataTransfer.effectAllowed,
    );
  });

  target.addEventListener("drop", function (event) {
    if (shouldRecordModifierKeys()) {
      events.push(phase + "-drop-keys:" + modifierState(event));
    }
    events.push(
      phase +
        "-drop:" +
        event.dataTransfer.getData("text") +
        ":" +
        event.dataTransfer.dropEffect +
        ":" +
        event.dataTransfer.effectAllowed +
        ":" +
        target.value,
    );
    expectedDrops += 1;
  });

  target.addEventListener("input", function () {
    events.push(
      phase +
        "-input:" +
        target.value +
        ":" +
        target.selectionStart +
        ":" +
        target.selectionEnd,
    );
    if (expectedDrops === 9) {
      resolve();
    }
  });
});

promise_test(async function () {
  await complete;
  assert_array_equals(
    events,
    [
      "none-enter:none:none",
      "none-over:none:none",
      "none-drop:none-text:none:none:hello world",
      "link-enter:link:link",
      "link-over:link:link",
      "link-drop:link-text:link:link:hello world",
      "link-input:hello link-text:15:15",
      "move-enter:move:move",
      "move-over:move:move",
      "move-drop:move-text:move:move:hello world",
      "move-input:hello move-text:15:15",
      "copyLink-enter:copy:copyLink",
      "copyLink-over:move:copyLink",
      "copyLink-drop:copylink-text:move:copyLink:hello world",
      "linkMove-enter:link:linkMove",
      "linkMove-over:copy:linkMove",
      "linkMove-drop:linkmove-text:copy:linkMove:hello world",
      "all-enter:copy:all",
      "all-over:link:all",
      "all-drop:all-text:link:all:hello world",
      "all-input:hello all-text:14:14",
      "modifiers-enter-keys:true,true,true,true",
      "modifiers-enter:copy:copy",
      "modifiers-over-keys:false,true,false,true",
      "modifiers-over:copy:copy",
      "modifiers-drop-keys:true,false,true,false",
      "modifiers-drop:modifiers-text:copy:copy:hello world",
      "modifiers-input:hello modifiers-text:20:20",
      "modifierSelection-enter-keys:false,true,false,false",
      "modifierSelection-enter:copy:all",
      "modifierSelection-over-keys:false,false,false,true",
      "modifierSelection-over:move:all",
      "modifierSelection-drop-keys:true,false,false,false",
      "modifierSelection-drop:auto-text:link:all:hello world",
      "modifierSelection-input:hello auto-text:15:15",
      "modifierPrecedence-enter-keys:false,false,true,false",
      "modifierPrecedence-enter:copy:all",
      "modifierPrecedence-over-keys:false,true,false,true",
      "modifierPrecedence-over:link:all",
      "modifierPrecedence-drop-keys:true,false,true,false",
      "modifierPrecedence-drop:precedence-text:link:all:hello world",
      "modifierPrecedence-input:hello precedence-text:21:21",
    ],
    "drag operation masks should map to effectAllowed/dropEffect and expose action modifiers",
  );
}, "Input.dispatchDragEvent exposes operation-mask effect negotiation and modifier-key matrix");
</script>
