<!doctype html>
<meta charset="utf-8">
<textarea id="target" style="display:block;width:200px;height:200px">hello world</textarea>
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
const target = document.getElementById("target");
const events = [];
let phase = "blocked";

function resetTargetValue() {
  target.value = "hello world";
  target.focus();
  target.setSelectionRange(6, 11);
}

resetTargetValue();

window.__advanceDragEffectNegotiationPhase = function () {
  phase = "allowed";
  resetTargetValue();
};

const dropped = new Promise(function (resolve) {
  target.addEventListener("dragenter", function (event) {
    events.push(
      phase +
        "-enter:" +
        event.dataTransfer.dropEffect +
        ":" +
        event.dataTransfer.effectAllowed,
    );
  });

  target.addEventListener("dragover", function (event) {
    event.preventDefault();
    event.dataTransfer.dropEffect = "move";
    events.push(
      phase +
        "-over:" +
        event.dataTransfer.dropEffect +
        ":" +
        event.dataTransfer.effectAllowed,
    );
  });

  target.addEventListener("drop", function (event) {
    events.push(
      phase +
        "-drop:" +
        event.dataTransfer.getData("text") +
        ":" +
        event.dataTransfer.dropEffect +
        ":" +
        event.dataTransfer.effectAllowed +
        ":" +
        target.value,
    );
    if (phase === "allowed") {
      setTimeout(resolve, 0);
    }
  });

  target.addEventListener("input", function () {
    events.push(
      phase +
        "-input:" +
        target.value +
        ":" +
        target.selectionStart +
        ":" +
        target.selectionEnd,
    );
  });
});

promise_test(async function () {
  await dropped;
  assert_array_equals(
    events,
    [
      "blocked-enter:none:copy",
      "blocked-over:move:copy",
      "blocked-drop:blocked-text:none:copy:hello world",
      "allowed-enter:none:copyMove",
      "allowed-over:move:copyMove",
      "allowed-drop:allowed-text:none:copyMove:hello world",
      "allowed-input:hello allowed-text:18:18",
    ],
    "independent drop views start with none, while the negotiated operation gates default insertion",
  );
}, "Input.dispatchDragEvent gates text drop defaults on effect negotiation");
</script>
