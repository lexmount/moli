<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function next_worker_result(worker) {
  return new Promise(function (resolve, reject) {
    function cleanup() {
      worker.removeEventListener("message", onMessage);
      worker.removeEventListener("error", onError);
    }

    function onMessage(event) {
      cleanup();
      resolve(event);
    }

    function onError(event) {
      cleanup();
      reject(event.error || new Error(event.message || "worker error"));
    }

    worker.addEventListener("message", onMessage);
    worker.addEventListener("error", onError);
  });
}

async function run_mode(mode) {
  const workerUrl = new URL(
    "/wpt/ported/worker/resources/worker-xhr-response-worker.js",
    location.href,
  ).href;
  const worker = new Worker(workerUrl);
  try {
    worker.postMessage({ mode: mode });
    const message = await next_worker_result(worker);
    assert_equals(message.data.mode, mode, "worker should echo the requested mode");
    return message.data;
  } finally {
    worker.terminate();
  }
}

promise_test(async function () {
  const result = await run_mode("json");

  assert_equals(result.status, 200, "json status");
  assert_equals(result.statusText, "OK", "json statusText");
  assert_equals(result.responseType, "json", "json responseType should stick");
  assert_equals(result.over, "9000!!!", "json field");
  assert_equals(result.updatedAtType, "number", "json numeric field type");
  assert_equals(result.updatedAt, 1765867200000, "json numeric field value");
  assert_equals(result.responseTextErrorName, "InvalidStateError", "json responseText should throw");
  assert_false(result.responseXmlExposed, "json worker should not expose responseXML");
}, "Dedicated workers expose XMLHttpRequest responseType=json");

promise_test(async function () {
  const result = await run_mode("arraybuffer");

  assert_equals(result.status, 200, "arraybuffer status");
  assert_equals(result.statusText, "OK", "arraybuffer statusText");
  assert_equals(result.responseType, "arraybuffer", "arraybuffer responseType should stick");
  assert_true(result.isArrayBuffer, "arraybuffer response should be an ArrayBuffer");
  assert_array_equals(result.bytes, [0, 0, 1, 2, 0, 0, 9], "arraybuffer bytes");
  assert_equals(result.responseTextErrorName, "InvalidStateError", "arraybuffer responseText should throw");
  assert_false(result.responseXmlExposed, "arraybuffer worker should not expose responseXML");
}, "Dedicated workers expose XMLHttpRequest responseType=arraybuffer");

promise_test(async function () {
  const result = await run_mode("blob");

  assert_equals(result.status, 200, "blob status");
  assert_equals(result.statusText, "OK", "blob statusText");
  assert_equals(result.responseType, "blob", "blob responseType should stick");
  assert_true(result.isBlob, "blob response should be a Blob");
  assert_equals(result.size, 7, "blob response size");
  assert_equals(result.type, "application/octet-stream", "blob response MIME type");
  assert_array_equals(result.bytes, [0, 0, 1, 2, 0, 0, 9], "blob response bytes");
  assert_equals(result.responseTextErrorName, "InvalidStateError", "blob responseText should throw");
  assert_false(result.responseXmlExposed, "blob worker should not expose responseXML");
}, "Dedicated workers expose XMLHttpRequest responseType=blob");

promise_test(async function () {
  const result = await run_mode("state-boundaries");

  assert_array_equals(result.states, [XMLHttpRequest.LOADING], "LOADING readystatechange should run");
  assert_equals(result.loadingErrorName, "InvalidStateError", "worker responseType should throw while LOADING");
  assert_equals(result.loadingPreservedResponseType, "text", "LOADING throw should preserve responseType");
  assert_equals(result.doneErrorName, "InvalidStateError", "worker responseType should throw after DONE");
  assert_equals(result.donePreservedResponseType, "text", "DONE throw should preserve responseType");
}, "Dedicated workers reject XMLHttpRequest responseType changes during LOADING or DONE");

promise_test(async function () {
  const result = await run_mode("document");

  assert_equals(result.status, 200, "document status");
  assert_equals(result.statusText, "OK", "document statusText");
  assert_equals(result.initialResponseType, "", "worker responseType=document should be ignored from the default state");
  assert_equals(result.retainedResponseType, "arraybuffer", "worker responseType=document should not overwrite an existing responseType");
  assert_equals(result.responseType, "", "ignored document responseType should stay empty after load");
  assert_true(result.responseIsString, "ignored document response should expose the text response");
  assert_true(result.responseEqualsText, "default response should equal responseText");
  assert_false(result.responseXmlExposed, "worker should not expose responseXML when document responseType is ignored");
  assert_true(result.responseText.includes("<body>"), "HTML fixture should remain serialized as text");
}, "Dedicated workers ignore XMLHttpRequest responseType=document");

promise_test(async function () {
  const result = await run_mode("invalid-response-type");

  assert_equals(result.errorName, null, "invalid responseType should be ignored in a worker");
  assert_equals(result.responseType, "arraybuffer", "invalid responseType should not overwrite the previous value in a worker");
}, "Dedicated workers ignore invalid XMLHttpRequest responseType values");
</script>
