<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script src="/wpt/ported/worker/resources/assert-bootstrap-error.js"></script>
<script>
function wait(ms) {
  return new Promise(function (resolve) {
    setTimeout(resolve, ms);
  });
}

function wait_for(promise, description) {
  return Promise.race([
    promise,
    wait(250).then(function () {
      throw new Error("timed out waiting for " + description);
    }),
  ]);
}

promise_test(async function () {
  const missingUrl = new URL(
    "/wpt/ported/worker/resources/missing-worker.js",
    location.href,
  ).href;
  const previousOnerror = window.onerror;

  const worker = new Worker(missingUrl);
  try {
    window.onerror = function () {
      return true;
    };

    const event = await wait_for(
      new Promise(function (resolve) {
        worker.onerror = resolve;
      }),
      "worker load failure onerror",
    );

    assert_worker_bootstrap_error(event, worker);
  } finally {
    window.onerror = previousOnerror;
    worker.terminate();
  }
}, "Dedicated worker load failures surface an asynchronous error event");

promise_test(async function () {
  const missingUrl = new URL(
    "/wpt/ported/worker/resources/missing-worker.js",
    location.href,
  ).href;
  const previousOnerror = window.onerror;
  const events = [];

  const worker = new Worker(missingUrl);
  try {
    window.onerror = function () {
      return true;
    };

    await wait_for(
      new Promise(function (resolve) {
        worker.addEventListener(
          "error",
          function () {
            events.push("listener");
            if (events.length >= 2) {
              resolve();
            }
          },
          { once: true },
        );
        worker.onerror = function () {
          events.push("onerror");
          if (events.length >= 2) {
            resolve();
          }
        };
      }),
      "worker load failure listener order",
    );

    assert_array_equals(
      events,
      ["listener", "onerror"],
      "worker error callbacks should follow registration order",
    );
  } finally {
    window.onerror = previousOnerror;
    worker.terminate();
  }
}, "Dedicated worker load failures notify both onerror and error listeners in registration order");

promise_test(async function () {
  const missingUrl = new URL(
    "/wpt/ported/worker/resources/missing-worker.js",
    location.href,
  ).href;
  const previousOnerror = window.onerror;
  const events = [];

  const worker = new Worker(missingUrl);
  try {
    window.onerror = function () {
      return true;
    };

    await wait_for(
      new Promise(function (resolve) {
        worker.onerror = function () {
          events.push("onerror");
          if (events.length >= 2) {
            resolve();
          }
        };
        worker.addEventListener(
          "error",
          function () {
            events.push("listener");
            if (events.length >= 2) {
              resolve();
            }
          },
          { once: true },
        );
      }),
      "worker load failure listener order after onerror assignment",
    );

    assert_array_equals(
      events,
      ["onerror", "listener"],
      "reassigning addEventListener after onerror should preserve the earlier onerror position",
    );
  } finally {
    window.onerror = previousOnerror;
    worker.terminate();
  }
}, "Dedicated worker load failures keep the onerror handler position when it is assigned first");
</script>
