<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script src="/wpt/ported/worker/resources/assert-bootstrap-error.js"></script>
<script>
function worker_url(source) {
  return "data:text/javascript," + encodeURIComponent(source);
}

function wait(ms) {
  return new Promise(function (resolve) {
    setTimeout(resolve, ms);
  });
}

async function assert_json_module_failure(source, description) {
  const previousOnerror = window.onerror;
  let messageSeen = false;
  const worker = new Worker(worker_url(source), { type: "module" });

  try {
    window.onerror = function () {
      return true;
    };
    worker.onmessage = function () {
      messageSeen = true;
    };

    const event = await Promise.race([
      new Promise(function (resolve) {
        worker.onerror = function (event) {
          resolve(event);
          return true;
        };
      }),
      wait(300).then(function () {
        throw new Error("timed out waiting for " + description);
      }),
    ]);

    assert_worker_bootstrap_error(event, worker);
    assert_false(messageSeen, "module evaluation should not continue after JSON import-attributes failure");
  } finally {
    window.onerror = previousOnerror;
    worker.terminate();
  }
}

promise_test(async function () {
  const jsonUrl = "data:application/json,%7B%22name%22%3A%22json%22%7D";
  const invalidJsonUrl = "data:application/json,%7B%22name%22%3A";
  const jsUrl = worker_url("export default 'js';");

  await assert_json_module_failure(
    [
      "import config from " + JSON.stringify(jsonUrl) + ";",
      "postMessage(config);",
    ].join("\n"),
    "static JSON import without type",
  );

  await assert_json_module_failure(
    [
      "import value from " + JSON.stringify(jsUrl) + " with { type: 'json' };",
      "postMessage(value);",
    ].join("\n"),
    "static non-JSON import with JSON type",
  );

  await assert_json_module_failure(
    [
      "import config from " + JSON.stringify(invalidJsonUrl) + " with { type: 'json' };",
      "postMessage(config);",
    ].join("\n"),
    "static invalid JSON import",
  );

}, "Dedicated module workers reject invalid static JSON import-attributes combinations");
</script>
