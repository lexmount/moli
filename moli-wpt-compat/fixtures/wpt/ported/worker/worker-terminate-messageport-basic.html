<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function worker_url(source) {
  return "data:text/javascript," + encodeURIComponent(source);
}

function next_worker_event(worker) {
  return new Promise(function (resolve, reject) {
    worker.addEventListener("message", resolve, { once: true });
    worker.addEventListener("error", function (event) {
      reject(new Error(event.message || "worker error"));
    }, { once: true });
  });
}

function next_port_close(port) {
  return new Promise(function (resolve) {
    port.addEventListener("close", resolve, { once: true });
    port.start();
  });
}

promise_test(async function () {
  const worker = new Worker(
    worker_url(
      [
        "const channel = new MessageChannel();",
        "channel.port1.onmessage = function (event) {",
        "  postMessage({ kind: 'port-message', data: event.data });",
        "};",
        "postMessage({ kind: 'ready' }, [channel.port2]);",
      ].join("\n"),
    ),
  );

  let port = null;
  try {
    const ready = await next_worker_event(worker);
    assert_equals(
      ready.data.kind,
      "ready",
      "worker should transfer a MessagePort before termination",
    );
    assert_equals(ready.ports.length, 1, "ready message should transfer one port");
    assert_true(
      ready.ports[0] instanceof MessagePort,
      "transferred value should be a MessagePort",
    );

    port = ready.ports[0];
    const closed = next_port_close(port);
    worker.terminate();

    const closeEvent = await closed;
    assert_equals(
      closeEvent.type,
      "close",
      "worker termination should close worker-owned ports and notify the remaining peer",
    );
  } finally {
    if (port) {
      port.close();
    }
    worker.terminate();
  }
}, "Worker.terminate disconnects worker-owned MessagePort callbacks");
</script>
