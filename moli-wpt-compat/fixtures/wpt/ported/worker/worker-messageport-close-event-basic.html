<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function worker_url() {
  const script = [
    "onmessage = function (event) {",
    "  const mode = event.data;",
    "  const port = event.ports[0];",
    "  const events = [];",
    "  function done() { postMessage({ mode: mode, events: events }); }",
    "  if (mode === 'listener-first') {",
    "    port.addEventListener('close', function (closeEvent) {",
    "      events.push('listener:' + closeEvent.type + ':' + closeEvent.isTrusted);",
    "    });",
    "    port.onclose = function (closeEvent) {",
    "      events.push('onclose:' + closeEvent.type + ':' + closeEvent.isTrusted);",
    "      done();",
    "    };",
    "  } else {",
    "    port.onclose = function (closeEvent) { events.push('onclose:' + closeEvent.isTrusted); };",
    "    port.addEventListener('close', function (closeEvent) {",
    "      events.push('listener:' + closeEvent.isTrusted);",
    "      done();",
    "    });",
    "  }",
    "  postMessage({ mode: mode, ready: true });",
    "};",
  ].join("\n");
  return URL.createObjectURL(new Blob([script], { type: "text/javascript" }));
}

function next_message(worker) {
  return new Promise(function (resolve, reject) {
    function onmessage(event) {
      worker.removeEventListener("message", onmessage);
      worker.removeEventListener("error", onerror);
      resolve(event.data);
    }
    function onerror(event) {
      worker.removeEventListener("message", onmessage);
      worker.removeEventListener("error", onerror);
      reject(new Error("Worker error: " + event.message));
    }
    worker.addEventListener("message", onmessage);
    worker.addEventListener("error", onerror);
  });
}

async function run_worker_close_case(mode) {
  const url = worker_url();
  const worker = new Worker(url);
  const channel = new MessageChannel();

  try {
    worker.postMessage(mode, [channel.port2]);
    const ready = await next_message(worker);
    assert_equals(ready.mode, mode, "worker should echo the active mode");
    assert_true(ready.ready, "worker should install close listeners before peer close");

    channel.port1.close();
    return await next_message(worker);
  } finally {
    channel.port1.close();
    worker.terminate();
    URL.revokeObjectURL(url);
  }
}

async function assert_worker_close_event_listener_first() {
  const result = await run_worker_close_case("listener-first");
  assert_array_equals(
    result.events,
    ["listener:close:true", "onclose:close:true"],
    "worker-owned close should be fired at the transferred peer in listener order",
  );
}

async function assert_worker_close_event_onclose_first() {
  const result = await run_worker_close_case("onclose-first");
  assert_array_equals(
    result.events,
    ["onclose:true", "listener:true"],
    "worker-owned onclose should keep its original event handler listener order",
  );
}

promise_test(async function () {
  await assert_worker_close_event_listener_first();
  await assert_worker_close_event_onclose_first();
}, "Worker-owned MessagePort close event dispatch preserves listener ordering");
</script>
