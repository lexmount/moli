<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function worker_url(source) {
  return "data:text/javascript," + encodeURIComponent(source);
}

function assert_throws_name(expectedName, callback, description) {
  let error = null;
  try {
    callback();
  } catch (thrown) {
    error = thrown;
  }
  assert_true(error !== null, (description || "assert_throws_name") + ": expected an exception");
  assert_equals(error.name, expectedName, (description || "assert_throws_name") + ": unexpected exception name");
}

function next_worker_message(worker, predicate) {
  return new Promise(function (resolve) {
    worker.addEventListener("message", function handler(event) {
      if (predicate && !predicate(event.data)) {
        return;
      }
      worker.removeEventListener("message", handler);
      resolve(event.data);
    });
  });
}

function with_timeout(promise, label) {
  return Promise.race([
    promise,
    new Promise(function (_resolve, reject) {
      step_timeout(function () {
        reject(new Error(label + " timed out"));
      }, 30000);
    }),
  ]);
}

promise_test(async function () {
  const worker = new Worker(
    worker_url(
      [
        "onmessage = function (event) {",
        "  if (event.data === 'connect') {",
        "    const port = event.ports[0];",
        "    const messages = [];",
        "    port.onmessage = function (messageEvent) {",
        "      messages.push(messageEvent.data);",
        "      if (messageEvent.data === 'first') {",
        "        port.close();",
        "      }",
        "      if (messageEvent.data === 'second') {",
        "        postMessage({ kind: 'done', messages });",
        "      }",
        "    };",
        "    postMessage({ kind: 'ready' });",
        "    return;",
        "  }",
        "  if (event.data && event.data.kind === 'closed') {",
        "    postMessage({kind: 'closed-ready', portsLength: event.ports.length,",
        "      isMessagePort: event.ports[0] instanceof MessagePort,",
        "      alias: event.data.port === event.ports[0]});",
        "    event.ports[0].close();",
        "    return;",
        "  }",
        "  if (event.data === 'peer') {",
        "    postMessage({",
        "      kind: 'peer-ready',",
        "      portsLength: event.ports.length,",
        "      isMessagePort: event.ports[0] instanceof MessagePort",
        "    });",
        "  }",
        "};",
      ].join("\n"),
    ),
  );
  const channel = new MessageChannel();
  const closedPair = new MessageChannel();

  try {
    const ready = next_worker_message(worker, function (data) {
      return data && data.kind === "ready";
    });
    const done = next_worker_message(worker, function (data) {
      return data && data.kind === "done";
    });

    // Queue both messages before the receiving port enters another agent.
    // This preserves the same inflight-message precondition as WPT close.any.js.
    channel.port1.postMessage("first");
    channel.port1.postMessage("second");
    worker.postMessage("connect", [channel.port2]);

    await with_timeout(ready, "worker-owned MessagePort ready");
    const result = await with_timeout(done, "worker-owned MessagePort close result");
    assert_array_equals(result.messages, ["first", "second"]);

    closedPair.port1.close();
    const closedReady = next_worker_message(worker, function (data) {
      return data && data.kind === "closed-ready";
    });
    worker.postMessage({kind: "closed", port: closedPair.port1}, [closedPair.port1]);
    assert_throws_name("DataCloneError", function () {
      worker.postMessage("neutered", [closedPair.port1]);
    }, "successful worker transfer neuters the original closed port");
    const closedResult = await with_timeout(closedReady, "closed connection transfer result");
    assert_equals(closedResult.portsLength, 1);
    assert_true(closedResult.isMessagePort);
    assert_true(closedResult.alias);

    const peerReady = next_worker_message(worker, function (data) {
      return data && data.kind === "peer-ready";
    });
    worker.postMessage("peer", [closedPair.port2]);

    const peerResult = await with_timeout(peerReady, "closed peer transfer result");
    assert_equals(peerResult.portsLength, 1);
    assert_true(peerResult.isMessagePort);
  } finally {
    channel.port1.close();
    worker.terminate();
  }
}, "Worker MessagePort.close preserves queued messages and peer transfer");
</script>
