<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script src="/wpt/runtime/fixture-server-config.js"></script>
<script>
const WORKER_URL = new URL(
  "/wpt/ported/worker/resources/worker-fetch-xhr-cors-redirect-worker.js",
  location.href,
).href;

function run_worker_case(kind) {
  return new Promise(function (resolve, reject) {
    const worker = new Worker(WORKER_URL);

    function cleanup() {
      worker.removeEventListener("message", onmessage);
      worker.removeEventListener("error", onerror);
      worker.terminate();
    }

    function onmessage(event) {
      if (!event.data || event.data.kind !== kind) {
        return;
      }
      cleanup();
      resolve(event.data);
    }

    function onerror(event) {
      cleanup();
      reject(event.error || new Error(event.message || "worker error"));
    }

    worker.addEventListener("message", onmessage);
    worker.addEventListener("error", onerror, { once: true });
    worker.postMessage({
      kind,
      alternatePort: __lmFixtureServerConfig.alternatePort,
    });
  });
}

promise_test(async function () {
  const result = await run_worker_case("fetch-same-to-cross");
  assert_equals(result.error, undefined, "worker fetch should resolve");
  assert_equals(result.type, "cors", "fetch response type");
  assert_true(result.redirected, "fetch response should expose redirect state");
  assert_true(
    result.url.endsWith("/wpt/runtime/cors/credentials/allow"),
    "fetch final response URL",
  );
  assert_equals(result.text, "cors-credentials-ok", "fetch response text");
}, "Dedicated worker fetch keeps the worker origin on same-origin to cross-origin credentialed CORS redirects");

promise_test(async function () {
  const result = await run_worker_case("xhr-same-to-cross");
  assert_equals(result.error, undefined, "worker XHR should resolve");
  assert_array_equals(result.events, ["load", "loadend"], "XHR success event order");
  assert_equals(result.status, 200, "XHR status");
  assert_true(
    result.responseURL.endsWith("/wpt/runtime/cors/credentials/allow"),
    "XHR final response URL",
  );
  assert_equals(result.responseText, "cors-credentials-ok", "XHR response text");
}, "Dedicated worker XMLHttpRequest keeps the worker origin on same-origin to cross-origin credentialed CORS redirects");

promise_test(async function () {
  const result = await run_worker_case("fetch-cross-to-same");
  assert_equals(result.error, undefined, "worker fetch should resolve");
  assert_equals(result.type, "cors", "fetch response type");
  assert_true(result.redirected, "fetch response should expose redirect state");
  assert_true(
    result.url.endsWith("/wpt/runtime/cors/redirect/same-origin-echo"),
    "fetch final response URL",
  );
  assert_equals(result.payload.response, "cors-redirect-same-origin-echo", "fetch response body");
  assert_equals(result.payload.origin, "null", "redirect-tainted worker fetch Origin");
}, "Dedicated worker fetch serializes Origin as null after a cross-origin redirect returns to the worker origin");
