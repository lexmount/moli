<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function wait(ms) {
  return new Promise(function (resolve) {
    setTimeout(resolve, ms);
  });
}

function wait_for(promise, description) {
  return Promise.race([
    promise,
    wait(250).then(function () {
      throw new Error("timed out waiting for " + description);
    }),
  ]);
}

promise_test(async function () {
  const workerUrl = new URL(
    "/wpt/ported/worker/resources/worker-error.js",
    location.href,
  ).href;
  const previousOnerror = window.onerror;
  let workerEvent = null;
  window.onerror = function () {
    return true;
  };

  const worker = new Worker(workerUrl);
  try {
    const workerErrorSeen = new Promise(function (resolve) {
      worker.onerror = function (event, second, third) {
        workerEvent = { event, second, third };
        resolve();
      };
    });

    await wait_for(workerErrorSeen, "worker.onerror");

    assert_true(workerEvent.event instanceof ErrorEvent, "worker.onerror should receive ErrorEvent");
    assert_equals(workerEvent.event.type, "error", "worker error event type");
    assert_true(
      workerEvent.event.message.indexOf("worker-boom") !== -1,
      "worker error message should mention the thrown error",
    );
    assert_equals(workerEvent.event.filename, workerUrl, "worker error filename");
    assert_equals(typeof workerEvent.event.lineno, "number", "worker error line number type");
    assert_equals(typeof workerEvent.event.colno, "number", "worker error column type");
    assert_equals(
      workerEvent.event.error,
      null,
      "worker error event should not expose the worker exception object",
    );
    assert_equals(workerEvent.second, undefined, "worker.onerror second argument");
    assert_equals(workerEvent.third, undefined, "worker.onerror third argument");
  } finally {
    window.onerror = previousOnerror;
    worker.terminate();
  }
}, "Dedicated worker runtime errors reach worker.onerror with ErrorEvent details");

promise_test(async function () {
  const workerUrl = new URL(
    "/wpt/ported/worker/resources/worker-error.js",
    location.href,
  ).href;
  const previousOnerror = window.onerror;
  window.onerror = function () {
    return true;
  };

  const worker = new Worker(workerUrl);
  try {
    const handlerSeen = new Promise(function (resolve) {
      worker.onerror = function () {
        resolve();
        return 1;
      };
    });
    const listenerSeen = new Promise(function (resolve) {
      worker.addEventListener(
        "error",
        function (event) {
          resolve(event.defaultPrevented);
        },
        { once: true },
      );
    });

    const defaultPrevented = await wait_for(listenerSeen, "worker error listener");
    await wait_for(handlerSeen, "worker.onerror non-boolean truthy handler");
    await wait(30);

    assert_false(
      defaultPrevented,
      "a non-boolean truthy worker.onerror return should not mark the error as handled",
    );
  } finally {
    window.onerror = previousOnerror;
    worker.terminate();
  }
}, "A non-boolean truthy Worker.onerror return does not cancel the error event");
</script>
