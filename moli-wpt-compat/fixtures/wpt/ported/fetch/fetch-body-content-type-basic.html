<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
const ECHO_BODY_HEX_URL = "/wpt/runtime/fetch/echo-body-hex";

async function echoContentType(body) {
  const response = await fetch(ECHO_BODY_HEX_URL, {
    method: "POST",
    body,
  });
  assert_equals(response.status, 200, "echo response status");
  return (await response.json()).content_type;
}

async function echoContentTypeWithHeaders(body, headers) {
  const response = await fetch(ECHO_BODY_HEX_URL, {
    method: "POST",
    headers,
    body,
  });
  assert_equals(response.status, 200, "echo response status");
  return (await response.json()).content_type;
}

async function fetchInputContentType(input) {
  const response = await fetch(input);
  assert_equals(response.status, 200, "echo response status");
  return (await response.json()).content_type;
}

test(function () {
  const request = new Request("https://example.test/upload", {
    method: "POST",
    body: "hello",
  });
  assert_equals(
    request.headers.get("content-type"),
    "text/plain;charset=UTF-8",
    "Request string bodies should install the default text/plain Content-Type",
  );

  const explicit = new Request("https://example.test/upload", {
    method: "POST",
    headers: [["Content-Type", "text/custom"]],
    body: "hello",
  });
  assert_equals(
    explicit.headers.get("content-type"),
    "text/custom",
    "Request should preserve an explicit Content-Type",
  );
}, "Request constructor applies BodyInit default Content-Type");

test(function () {
  const params = new URLSearchParams([["alpha", "one"], ["beta", "two"]]);
  const request = new Request("https://example.test/upload", {
    method: "POST",
    body: params,
  });
  assert_equals(
    request.headers.get("content-type"),
    "application/x-www-form-urlencoded;charset=UTF-8",
    "URLSearchParams should install the urlencoded Content-Type",
  );

  const blob = new Blob(["hello"], { type: "text/custom" });
  const blobRequest = new Request("https://example.test/upload", {
    method: "POST",
    body: blob,
  });
  assert_equals(
    blobRequest.headers.get("content-type"),
    "text/custom",
    "Blob type should become the default Content-Type",
  );

  const bytesRequest = new Request("https://example.test/upload", {
    method: "POST",
    body: new Uint8Array([1, 2, 3]),
  });
  assert_equals(
    bytesRequest.headers.get("content-type"),
    null,
    "BufferSource bodies should not install a default Content-Type",
  );

  const explicitBytesRequest = new Request("https://example.test/upload", {
    method: "POST",
    headers: [["Content-Type", "application/custom-bytes"]],
    body: new Uint8Array([1, 2, 3]),
  });
  assert_equals(
    explicitBytesRequest.headers.get("content-type"),
    "application/custom-bytes",
    "BufferSource bodies should preserve an explicit Content-Type on Request",
  );
}, "Request constructor applies structured BodyInit default Content-Type");

test(function () {
  const response = new Response("hello");
  assert_equals(
    response.headers.get("content-type"),
    "text/plain;charset=UTF-8",
    "Response string bodies should install the default text/plain Content-Type",
  );

  const explicit = new Response("hello", {
    headers: [["Content-Type", "text/custom"]],
  });
  assert_equals(
    explicit.headers.get("content-type"),
    "text/custom",
    "Response should preserve an explicit Content-Type",
  );
}, "Response constructor applies BodyInit default Content-Type");

test(function () {
  const response = new Response(new URLSearchParams([["alpha", "one"]]));
  assert_equals(
    response.headers.get("content-type"),
    "application/x-www-form-urlencoded;charset=UTF-8",
    "URLSearchParams should install the urlencoded Content-Type on Response",
  );

  const blob = new Response(new Blob(["hello"], { type: "text/custom" }));
  assert_equals(
    blob.headers.get("content-type"),
    "text/custom",
    "Blob type should become the default Response Content-Type",
  );

  const bytes = new Response(new Uint8Array([1, 2, 3]));
  assert_equals(
    bytes.headers.get("content-type"),
    null,
    "BufferSource Response bodies should not install a default Content-Type",
  );

  const explicitBytes = new Response(new Uint8Array([1, 2, 3]), {
    headers: [["Content-Type", "application/custom-response-bytes"]],
  });
  assert_equals(
    explicitBytes.headers.get("content-type"),
    "application/custom-response-bytes",
    "BufferSource Response bodies should preserve an explicit Content-Type",
  );
}, "Response constructor applies structured BodyInit default Content-Type");

promise_test(async function () {
  assert_equals(
    await echoContentType("hello"),
    "text/plain;charset=UTF-8",
    "fetch string body should send default text/plain Content-Type",
  );
  assert_equals(
    await echoContentType(new URLSearchParams([["alpha", "one"]])),
    "application/x-www-form-urlencoded;charset=UTF-8",
    "fetch URLSearchParams body should send default urlencoded Content-Type",
  );
  assert_equals(
    await echoContentType(new Blob(["hello"], { type: "text/custom" })),
    "text/custom",
    "fetch Blob body should send the Blob type as Content-Type",
  );
  assert_equals(
    await echoContentType(new Uint8Array([1, 2, 3])),
    null,
    "fetch BufferSource body should not send a default Content-Type",
  );
}, "fetch() sends BodyInit default Content-Type only when one is defined");

promise_test(async function () {
  assert_equals(
    await echoContentTypeWithHeaders("hello", [["Content-Type", "text/custom"]]),
    "text/custom",
    "fetch string body should preserve an explicit Content-Type",
  );
  assert_equals(
    await echoContentTypeWithHeaders(
      new URLSearchParams([["alpha", "one"]]),
      [["Content-Type", "application/custom-form"]],
    ),
    "application/custom-form",
    "fetch URLSearchParams body should preserve an explicit Content-Type",
  );
  assert_equals(
    await echoContentTypeWithHeaders(
      new Blob(["hello"], { type: "text/blob-default" }),
      [["Content-Type", "text/custom-blob"]],
    ),
    "text/custom-blob",
    "fetch Blob body should preserve an explicit Content-Type",
  );
  assert_equals(
    await echoContentTypeWithHeaders(
      new Uint8Array([1, 2, 3]),
      [["Content-Type", "application/custom-bytes"]],
    ),
    "application/custom-bytes",
    "fetch BufferSource body should preserve an explicit Content-Type",
  );
}, "fetch() preserves explicit Content-Type over BodyInit defaults");

promise_test(async function () {
  const request = new Request(ECHO_BODY_HEX_URL, {
    method: "POST",
    body: "hello",
  });
  assert_equals(
    await fetchInputContentType(request),
    "text/plain;charset=UTF-8",
    "fetch(Request) should inherit body and headers from the input Request",
  );

  const replaced = new Request(ECHO_BODY_HEX_URL, {
    method: "POST",
    body: new Uint8Array([1, 2, 3]),
  });
  assert_equals(
    await fetchInputContentType(replaced),
    null,
    "fetch(Request) should suppress transport defaults for inherited BufferSource bodies",
  );

  const explicitBytes = new Request(ECHO_BODY_HEX_URL, {
    method: "POST",
    headers: [["Content-Type", "application/request-bytes"]],
    body: new Uint8Array([1, 2, 3]),
  });
  assert_equals(
    await fetchInputContentType(explicitBytes),
    "application/request-bytes",
    "fetch(Request) should preserve inherited explicit BufferSource Content-Type",
  );
}, "fetch() inherits Request body headers without adding transport defaults");

async function contentTypeVariants(url) {
  const results = [];
  const bodies = [
    ["no body", undefined, null],
    ["text", "hello", "text/plain;charset=UTF-8"],
    ["bytes", new Uint8Array([1, 2, 3]), null],
    ["untyped Blob", new Blob(["hello"]), null],
    ["typed Blob", new Blob(["hello"], { type: "text/custom" }), "text/custom"],
  ];
  for (const [label, body, defaultType] of bodies) {
    for (const contentType of [null, "", "application/custom"]) {
      const headers = contentType === null ? {} : { "cOnTeNt-TyPe": contentType };
      const init = { method: "POST", headers, body };
      const expected = contentType === null ? defaultType : contentType;
      const description = label + "/" + JSON.stringify(contentType);
      const direct = await fetch(url, init);
      results.push(["fetch/" + description, (await direct.json()).content_type, expected]);
      const inherited = await fetch(new Request(url, init));
      results.push(["fetch(Request)/" + description, (await inherited.json()).content_type, expected]);
      const xhrType = await new Promise(function (resolve, reject) {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", url);
        if (contentType !== null) xhr.setRequestHeader("cOnTeNt-TyPe", contentType);
        xhr.responseType = "json";
        xhr.onload = function () { resolve(xhr.response.content_type); };
        xhr.onerror = function () { reject(new Error("XHR failed for " + description)); };
        xhr.send(body);
      });
      results.push(["XHR/" + description, xhrType, expected]);
    }
  }
  return results;
}

promise_test(async function () {
  for (const [label, actual, expected] of await contentTypeVariants(ECHO_BODY_HEX_URL)) {
    assert_equals(actual, expected, label);
  }
}, "Window fetch and XHR distinguish absent, empty and nonempty Content-Type on the wire");

promise_test(async function (t) {
  const url = new URL(ECHO_BODY_HEX_URL, location.href).href;
  const source = "(" + contentTypeVariants.toString() + ")(" + JSON.stringify(url) + ")" +
    ".then(results => postMessage({results}), error => postMessage({error: String(error)}));";
  const workerUrl = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
  t.add_cleanup(function () { URL.revokeObjectURL(workerUrl); });
  const worker = new Worker(workerUrl);
  t.add_cleanup(function () { worker.terminate(); });
  const message = await new Promise(function (resolve, reject) {
    worker.onmessage = resolve;
    worker.onerror = function (event) { reject(new Error(event.message)); };
  });
  assert_equals(message.data.error, undefined, "worker requests complete");
  for (const [label, actual, expected] of message.data.results) {
    assert_equals(actual, expected, label);
  }
}, "Worker fetch and XHR distinguish absent, empty and nonempty Content-Type on the wire");
</script>
