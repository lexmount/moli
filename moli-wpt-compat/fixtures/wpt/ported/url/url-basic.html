<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(name, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(error.name, name, description);
    return;
  }
  assert_unreached(description || `Expected ${name}`);
}

test(function () {
  const url = new URL("../next?q=one#top", "https://user:pass@example.test:8443/root/base/");
  assert_equals(url.href, "https://user:pass@example.test:8443/root/next?q=one#top");
  assert_equals(url.origin, "https://example.test:8443");
  assert_equals(url.protocol, "https:");
  assert_equals(url.username, "user");
  assert_equals(url.password, "pass");
  assert_equals(url.host, "example.test:8443");
  assert_equals(url.pathname, "/root/next");
  assert_equals(url.search, "?q=one");
  assert_equals(url.hash, "#top");

  url.protocol = "http:";
  url.host = "example.test";
  url.pathname = "/changed";
  url.search = "?q=two";
  url.hash = "#done";
  assert_equals(url.href, "http://user:pass@example.test:8443/changed?q=two#done");
  assert_equals(String(url), url.href);
  assert_equals(url.toJSON(), url.href);
}, "URL resolves relative input and exposes mutable URL components");

test(function () {
  const url = new URL("https://user:pass@example.test:8443/root/base/");

  url.hostname = "api.example.test";
  assert_equals(
    url.href,
    "https://user:pass@api.example.test:8443/root/base/",
    "hostname setter should preserve the existing port",
  );

  url.host = "static.example.test";
  assert_equals(
    url.href,
    "https://user:pass@static.example.test:8443/root/base/",
    "host setter without an explicit port should preserve the existing port",
  );

  url.host = "cdn.example.test:9443";
  assert_equals(
    url.href,
    "https://user:pass@cdn.example.test:9443/root/base/",
    "host setter with an explicit port should replace both hostname and port",
  );

  url.host = "cdn.example.test:";
  assert_equals(url.port, "9443", "host setter with an empty port should preserve the existing port");

  url.port = "";
  assert_equals(
    url.href,
    "https://user:pass@cdn.example.test/root/base/",
    "port setter with an empty value should explicitly clear the port",
  );
}, "URL host and hostname setters keep port semantics aligned");

test(function () {
  assert_true(URL.canParse("/next", "https://example.test/base/"));
  assert_false(URL.canParse("relative"));
  assert_equals(URL.parse("relative"), null);
}, "URL static parse helpers report parseability");

test(function () {
  assert_throws_name("TypeError", () => new URL(), "missing required url should throw");
  assert_throws_name("TypeError", () => new URL(Symbol("url")), "url Symbol conversion should throw");
  assert_throws_name(
    "Error",
    () => new URL({ toString() { throw new Error("url conversion failed"); } }),
    "url stringification errors should propagate",
  );

  const base = new URL("https://example.test/root/base/");
  assert_equals(
    new URL("../child", base).href,
    "https://example.test/root/child",
    "URL object base should stringify through its default stringifier",
  );
  base.toString = () => { throw new Error("overridden base stringifier failed"); };
  assert_throws_name(
    "Error",
    () => new URL("../child", base),
    "URL object base should not bypass stringification",
  );
  assert_equals(
    new URL("../child", { toString() { return "https://example.test/root/base/"; } }).href,
    "https://example.test/root/child",
    "ordinary base objects should stringify through WebIDL USVString conversion",
  );
  assert_throws_name(
    "Error",
    () => new URL("../child", { toString() { throw new Error("base conversion failed"); } }),
    "base stringification errors should propagate",
  );
  assert_throws_name(
    "TypeError",
    () => new URL("../child", Symbol("base")),
    "base Symbol conversion should throw",
  );
}, "URL constructor uses WebIDL USVString conversion");
</script>
