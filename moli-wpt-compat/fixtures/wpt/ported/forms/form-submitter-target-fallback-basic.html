<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<body></body>
<script>
function read_frame_text(frame) {
  return frame.contentDocument?.body?.textContent?.trim() ?? "";
}

function wait_for_value(read, expected, description) {
  return new Promise(function (resolve, reject) {
    const deadline = Date.now() + 1000;
    function poll() {
      const value = read();
      if (value === expected) {
        resolve(value);
        return;
      }
      if (Date.now() >= deadline) {
        reject(new Error("timed out waiting for " + description + ": got " + value));
        return;
      }
      setTimeout(poll, 10);
    }
    poll();
  });
}

function append_target_frame(name) {
  const frame = document.createElement("iframe");
  frame.name = name;
  document.body.appendChild(frame);
  return frame;
}

function append_form(sourceFrame, target, caseName) {
  const owner = sourceFrame.contentDocument;
  const form = owner.createElement("form");
  form.target = target;
  form.action = new URL("../navigation/resources/a-page.html", location.href).href;

  const hidden = owner.createElement("input");
  hidden.type = "hidden";
  hidden.name = "case";
  hidden.value = caseName;
  form.appendChild(hidden);

  owner.body.appendChild(form);
  return form;
}

const emptyOverrideSource = append_target_frame("empty-override-source");
const emptyOverrideFrame = append_target_frame("empty-override-target");
const emptyOverrideForm = append_form(emptyOverrideSource, "empty-override-target", "empty-override");
let emptyOverrideSubmitCount = 0;
emptyOverrideForm.addEventListener("submit", function () {
  emptyOverrideSubmitCount += 1;
});
const emptyOverrideSubmitter = emptyOverrideSource.contentDocument.createElement("button");
emptyOverrideSubmitter.type = "submit";
emptyOverrideSubmitter.setAttribute("formtarget", "");
emptyOverrideForm.appendChild(emptyOverrideSubmitter);
emptyOverrideForm.requestSubmit(emptyOverrideSubmitter);

const missingOverrideSource = append_target_frame("missing-override-source");
const missingOverrideFrame = append_target_frame("missing-override-target");
const missingOverrideForm = append_form(missingOverrideSource, "missing-override-target", "missing-override");
let missingOverrideSubmitCount = 0;
missingOverrideForm.addEventListener("submit", function () {
  missingOverrideSubmitCount += 1;
});
const missingOverrideSubmitter = missingOverrideSource.contentDocument.createElement("input");
missingOverrideSubmitter.type = "submit";
missingOverrideForm.appendChild(missingOverrideSubmitter);
missingOverrideForm.requestSubmit(missingOverrideSubmitter);

const externalEmptyOverrideSource = append_target_frame("external-empty-override-source");
const externalEmptyOverrideFrame = append_target_frame("external-empty-override-target");
const externalEmptyOverrideForm = append_form(externalEmptyOverrideSource, "external-empty-override-target", "external-empty-override");
externalEmptyOverrideForm.id = "external-empty-override-form";
let externalEmptyOverrideSubmitCount = 0;
let externalEmptyOverrideSubmitterSeen = null;
externalEmptyOverrideForm.addEventListener("submit", function (event) {
  externalEmptyOverrideSubmitCount += 1;
  externalEmptyOverrideSubmitterSeen = event.submitter;
});
const externalEmptyOverrideSubmitter = externalEmptyOverrideSource.contentDocument.createElement("button");
externalEmptyOverrideSubmitter.type = "submit";
externalEmptyOverrideSubmitter.setAttribute("form", externalEmptyOverrideForm.id);
externalEmptyOverrideSubmitter.setAttribute("formtarget", "");
externalEmptyOverrideSource.contentDocument.body.appendChild(externalEmptyOverrideSubmitter);
externalEmptyOverrideForm.requestSubmit(externalEmptyOverrideSubmitter);

const externalMissingOverrideSource = append_target_frame("external-missing-override-source");
const externalMissingOverrideFrame = append_target_frame("external-missing-override-target");
const externalMissingOverrideForm = append_form(externalMissingOverrideSource, "external-missing-override-target", "external-missing-override");
externalMissingOverrideForm.id = "external-missing-override-form";
let externalMissingOverrideSubmitCount = 0;
let externalMissingOverrideSubmitterSeen = null;
externalMissingOverrideForm.addEventListener("submit", function (event) {
  externalMissingOverrideSubmitCount += 1;
  externalMissingOverrideSubmitterSeen = event.submitter;
});
const externalMissingOverrideSubmitter = externalMissingOverrideSource.contentDocument.createElement("button");
externalMissingOverrideSubmitter.type = "submit";
externalMissingOverrideSubmitter.setAttribute("form", externalMissingOverrideForm.id);
externalMissingOverrideSource.contentDocument.body.appendChild(externalMissingOverrideSubmitter);
externalMissingOverrideForm.requestSubmit(externalMissingOverrideSubmitter);

test(function () {
  assert_equals(read_frame_text(emptyOverrideFrame), "", "empty formtarget target should start blank");
  assert_equals(read_frame_text(missingOverrideFrame), "", "missing formtarget target should start blank");
  assert_equals(read_frame_text(externalEmptyOverrideFrame), "", "external empty formtarget target should start blank");
  assert_equals(read_frame_text(externalMissingOverrideFrame), "", "external missing formtarget target should start blank");
  assert_equals(emptyOverrideSubmitCount, 1, "empty formtarget submitter should dispatch submit");
  assert_equals(missingOverrideSubmitCount, 1, "missing formtarget submitter should dispatch submit");
  assert_equals(externalEmptyOverrideSubmitCount, 1, "external empty formtarget submitter should dispatch submit");
  assert_equals(externalMissingOverrideSubmitCount, 1, "external missing formtarget submitter should dispatch submit");
  assert_equals(
    externalEmptyOverrideSubmitterSeen,
    externalEmptyOverrideSubmitter,
    "external empty formtarget submit event should preserve the external submitter",
  );
  assert_equals(
    externalMissingOverrideSubmitterSeen,
    externalMissingOverrideSubmitter,
    "external missing formtarget submit event should preserve the external submitter",
  );
}, "Submitter targets start navigation asynchronously");

promise_test(async function () {
  await wait_for_value(function () {
    return read_frame_text(emptyOverrideSource);
  }, "a-page", "empty formtarget source load");
  await wait_for_value(function () {
    return read_frame_text(missingOverrideFrame);
  }, "a-page", "missing formtarget fallback load");
  await wait_for_value(function () {
    return read_frame_text(externalEmptyOverrideSource);
  }, "a-page", "external empty formtarget source load");
  await wait_for_value(function () {
    return read_frame_text(externalMissingOverrideFrame);
  }, "a-page", "external missing formtarget fallback load");

  assert_equals(
    read_frame_text(emptyOverrideSource),
    "a-page",
    "empty formtarget should navigate the source document",
  );
  assert_equals(
    read_frame_text(missingOverrideFrame),
    "a-page",
    "missing formtarget should use the form target",
  );
  assert_equals(
    read_frame_text(externalEmptyOverrideSource),
    "a-page",
    "external empty formtarget should navigate the source document",
  );
  assert_equals(
    read_frame_text(externalMissingOverrideFrame),
    "a-page",
    "external missing formtarget should use the form target",
  );
  assert_equals(read_frame_text(emptyOverrideFrame), "", "empty formtarget must override the form target");
  assert_equals(read_frame_text(externalEmptyOverrideFrame), "", "external empty formtarget must override the form target");
  assert_equals(read_frame_text(missingOverrideSource), "", "missing formtarget must leave the source document in place");
  assert_equals(read_frame_text(externalMissingOverrideSource), "", "external missing formtarget must leave the source document in place");
  assert_equals(emptyOverrideSubmitCount, 1, "empty formtarget submitter should submit exactly once");
  assert_equals(missingOverrideSubmitCount, 1, "missing formtarget submitter should submit exactly once");
  assert_equals(
    externalEmptyOverrideSubmitCount,
    1,
    "external empty formtarget submitter should submit exactly once",
  );
  assert_equals(
    externalMissingOverrideSubmitCount,
    1,
    "external missing formtarget submitter should submit exactly once",
  );
}, "Empty formtarget selects the source and missing formtarget uses the form target");
</script>
