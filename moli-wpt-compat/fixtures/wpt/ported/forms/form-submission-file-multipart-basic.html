<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<body></body>
<script>
function read_frame_text(frame) {
  return frame.contentDocument?.body?.textContent?.trim() ?? "";
}

function read_payload(frame) {
  const text = read_frame_text(frame);
  if (text === "") {
    return null;
  }
  return JSON.parse(text);
}

function wait(ms) {
  return new Promise(function (resolve) {
    setTimeout(resolve, ms);
  });
}

function wait_for_payload(frame, description) {
  return Promise.race([
    new Promise(function (resolve, reject) {
      const deadline = Date.now() + 1000;
      function poll() {
        const payload = read_payload(frame);
        if (payload !== null) {
          resolve(payload);
          return;
        }
        if (Date.now() >= deadline) {
          reject(new Error("timed out waiting for " + description));
          return;
        }
        setTimeout(poll, 10);
      }
      poll();
    }),
    wait(1100).then(function () {
      throw new Error("timed out waiting for " + description);
    }),
  ]);
}

function append_target_frame(name) {
  const frame = document.createElement("iframe");
  frame.name = name;
  document.body.appendChild(frame);
  return frame;
}

function file_list(files) {
  const transfer = new DataTransfer();
  for (const file of files) {
    transfer.items.add(file);
  }
  return transfer.files;
}

test(function () {
  const text = document.createElement("input");
  assert_equals(text.files, null, "files should not apply to non-file inputs");

  const input = document.createElement("input");
  input.type = "file";
  const empty = input.files;
  assert_true(empty instanceof FileList, "file inputs expose a FileList");
  assert_equals(empty.length, 0, "new file inputs start with no selected files");
  assert_equals(input.files, empty, "files getter should return the same object until replaced");

  const file = new File(["file-body"], "note.txt", { type: "text/plain" });
  const files = file_list([file]);
  input.files = files;
  assert_equals(input.files, files, "files setter should install the selected FileList");
}, "HTMLInputElement.files exposes a replaceable FileList for file inputs");

test(function () {
  const form = document.createElement("form");
  const emptyInput = document.createElement("input");
  emptyInput.type = "file";
  emptyInput.name = "empty";
  const upload = document.createElement("input");
  upload.type = "file";
  upload.name = "upload";
  upload.multiple = true;
  upload.files = file_list([
    new File(["alpha-body"], "alpha.txt", { type: "text/plain" }),
    new File(["beta-body"], "beta.bin"),
  ]);
  form.append(emptyInput, upload);
  document.body.appendChild(form);

  const data = new FormData(form);
  const empty = data.get("empty");
  assert_true(empty instanceof File, "empty file input should contribute a File");
  assert_equals(empty.name, "", "empty file fallback should have an empty filename");
  assert_equals(empty.type, "application/octet-stream", "empty file fallback should use the default MIME type");
  assert_equals(empty.size, 0, "empty file fallback should have an empty body");

  const files = data.getAll("upload");
  assert_equals(files.length, 2, "multiple selected files should produce repeated entries");
  assert_equals(files[0].name, "alpha.txt", "first file name");
  assert_equals(files[0].type, "text/plain", "first file type");
  assert_equals(files[1].name, "beta.bin", "second file name");
}, "FormData(form) serializes file inputs as File entries");

promise_test(async function () {
  const frame = append_target_frame("file-multipart-target");
  const form = document.createElement("form");
  form.target = "file-multipart-target";
  form.action = "/wpt/runtime/forms/submit-echo?case=file-multipart";
  form.method = "post";
  form.setAttribute("enctype", "multipart/form-data");

  const title = document.createElement("input");
  title.name = "title";
  title.value = "line\nvalue";
  const upload = document.createElement("input");
  upload.type = "file";
  upload.name = "upload";
  upload.files = file_list([
    new File(["file-body"], 'report"name.txt', { type: "text/custom" }),
  ]);
  const emptyInput = document.createElement("input");
  emptyInput.type = "file";
  emptyInput.name = "empty";
  const submitter = document.createElement("button");
  submitter.type = "submit";
  submitter.name = "submitter";
  submitter.value = "send";
  form.append(title, upload, emptyInput, submitter);
  let eventFormData = null;
  form.addEventListener("formdata", function (event) {
    eventFormData = event.formData;
    event.formData.append("event-added", "yes");
  });
  document.body.appendChild(form);

  form.requestSubmit(submitter);
  const payload = await wait_for_payload(frame, "file multipart submission");

  assert_true(eventFormData instanceof FormData, "submission should dispatch a formdata event");
  assert_equals(payload.method, "POST", "multipart file submission should use POST");
  assert_equals(payload.search, "?case=file-multipart", "POST should preserve the action query");
  assert_true(
    payload.content_type.startsWith("multipart/form-data; boundary=----MoliFormBoundary"),
    "multipart file submission should install a form boundary",
  );
  const boundary = payload.content_type.slice("multipart/form-data; boundary=".length);
  const expectedBody =
    "--" + boundary + "\r\n" +
    'Content-Disposition: form-data; name="title"\r\n\r\n' +
    "linevalue\r\n" +
    "--" + boundary + "\r\n" +
    'Content-Disposition: form-data; name="upload"; filename="report%22name.txt"\r\n' +
    "Content-Type: text/custom\r\n\r\n" +
    "file-body\r\n" +
    "--" + boundary + "\r\n" +
    'Content-Disposition: form-data; name="empty"; filename=""\r\n' +
    "Content-Type: application/octet-stream\r\n\r\n" +
    "\r\n" +
    "--" + boundary + "\r\n" +
    'Content-Disposition: form-data; name="submitter"\r\n\r\n' +
    "send\r\n" +
    "--" + boundary + "\r\n" +
    'Content-Disposition: form-data; name="event-added"\r\n\r\n' +
    "yes\r\n" +
    "--" + boundary + "--\r\n";
  assert_equals(payload.body, expectedBody, "multipart body should preserve file parts in DOM order");

  const externalFrame = append_target_frame("external-file-multipart-target");
  const externalForm = document.createElement("form");
  externalForm.id = "external-file-multipart-form";
  externalForm.target = "external-file-multipart-target";
  externalForm.action = "/wpt/runtime/forms/submit-echo?case=external-file-multipart";
  externalForm.method = "get";
  externalForm.setAttribute("enctype", "text/plain");

  const externalTitle = document.createElement("input");
  externalTitle.name = "title";
  externalTitle.value = "external";
  const externalUpload = document.createElement("input");
  externalUpload.type = "file";
  externalUpload.name = "upload";
  externalUpload.multiple = true;
  externalUpload.files = file_list([
    new File(["external-alpha-body"], "external-alpha.txt", { type: "text/external-alpha" }),
    new File(["external-beta-body"], "external-beta.bin"),
  ]);
  const externalEmpty = document.createElement("input");
  externalEmpty.type = "file";
  externalEmpty.name = "empty";
  const externalSubmitter = document.createElement("button");
  externalSubmitter.type = "submit";
  externalSubmitter.name = "submitter";
  externalSubmitter.value = "external-send";
  externalSubmitter.setAttribute("form", externalForm.id);
  externalSubmitter.setAttribute("formmethod", "post");
  externalSubmitter.setAttribute("formenctype", "multipart/form-data");
  externalForm.append(externalTitle, externalUpload, externalEmpty);
  document.body.append(externalForm, externalSubmitter);

  externalForm.requestSubmit(externalSubmitter);
  const externalPayload = await wait_for_payload(externalFrame, "external file multipart submission");

  assert_equals(externalPayload.method, "POST", "external multipart submitter should override form method=get");
  assert_equals(
    externalPayload.search,
    "?case=external-file-multipart",
    "external multipart POST should preserve the action query",
  );
  assert_true(
    externalPayload.content_type.startsWith("multipart/form-data; boundary=----MoliFormBoundary"),
    "external multipart file submission should install a form boundary",
  );
  const externalBoundary = externalPayload.content_type.slice("multipart/form-data; boundary=".length);
  const expectedExternalBody =
    "--" + externalBoundary + "\r\n" +
    'Content-Disposition: form-data; name="title"\r\n\r\n' +
    "external\r\n" +
    "--" + externalBoundary + "\r\n" +
    'Content-Disposition: form-data; name="upload"; filename="external-alpha.txt"\r\n' +
    "Content-Type: text/external-alpha\r\n\r\n" +
    "external-alpha-body\r\n" +
    "--" + externalBoundary + "\r\n" +
    'Content-Disposition: form-data; name="upload"; filename="external-beta.bin"\r\n' +
    "Content-Type: application/octet-stream\r\n\r\n" +
    "external-beta-body\r\n" +
    "--" + externalBoundary + "\r\n" +
    'Content-Disposition: form-data; name="empty"; filename=""\r\n' +
    "Content-Type: application/octet-stream\r\n\r\n" +
    "\r\n" +
    "--" + externalBoundary + "\r\n" +
    'Content-Disposition: form-data; name="submitter"\r\n\r\n' +
    "external-send\r\n" +
    "--" + externalBoundary + "--\r\n";
  assert_equals(
    externalPayload.body,
    expectedExternalBody,
    "external submitter multipart body should preserve repeated and empty file parts before the active external submitter",
  );
}, "Named-target multipart form submission serializes selected and empty file inputs");
</script>
