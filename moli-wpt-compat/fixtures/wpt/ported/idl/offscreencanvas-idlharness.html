<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script src="/wpt/resources/WebIDLParser.js"></script>
<script src="/wpt/resources/idlharness.js"></script>
<script>
idl_test([`
interface OffscreenCanvas {
  constructor([EnforceRange] unsigned long long width, [EnforceRange] unsigned long long height);
  attribute unsigned long long width;
  attribute unsigned long long height;
  RenderingContext? getContext(DOMString contextId, optional any options = null);
  ImageBitmap transferToImageBitmap();
  Promise<Blob> convertToBlob(optional ImageEncodeOptions options = {});
};

typedef (OffscreenCanvasRenderingContext2D) RenderingContext;
dictionary ImageEncodeOptions {
  DOMString type = "image/png";
  unrestricted double quality;
};
`], [], function (idlArray) {
  idlArray.enable_function_length_assertions();
  idlArray.enable_interface_descriptor_assertions();
  idlArray.enable_operation_descriptor_assertions();
  idlArray.enable_attribute_descriptor_assertions();
  idlArray.enable_object_brand_assertions();
  idlArray.add_objects({
    OffscreenCanvas: ["new OffscreenCanvas(16, 8)"]
  });
});

promise_test(async function () {
  const canvas = new OffscreenCanvas(32, 16);
  const context = canvas.getContext("2d");
  const blob = await canvas.convertToBlob();

  assert_false(canvas.hasOwnProperty("width"));
  assert_false(canvas.hasOwnProperty("height"));
  assert_equals(canvas.width, 32);
  assert_equals(canvas.height, 16);
  canvas.width = 48;
  canvas.height = 24;
  assert_equals(canvas.width, 48);
  assert_equals(canvas.height, 24);
  assert_true(context instanceof OffscreenCanvasRenderingContext2D);
  assert_true(blob instanceof Blob);
}, "OffscreenCanvas idlharness sample operations expose 2D context and Blob conversion");
</script>
