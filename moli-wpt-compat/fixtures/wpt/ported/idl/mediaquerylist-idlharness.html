<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script src="/wpt/resources/WebIDLParser.js"></script>
<script src="/wpt/resources/idlharness.js"></script>
<script>
function assert_throws_name(name, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(error.name, name, description);
    return;
  }
  assert_unreached(description || `Expected ${name}`);
}

idl_test([`
interface MediaQueryList : EventTarget {
  readonly attribute CSSOMString media;
  readonly attribute boolean matches;
  attribute EventHandler onchange;
  undefined addListener(any callback);
  undefined removeListener(any callback);
};

typedef DOMString CSSOMString;
callback EventHandler = any (Event event);
`], [], function (idlArray) {
  idlArray.enable_function_length_assertions();
  idlArray.enable_interface_descriptor_assertions();
  idlArray.enable_operation_descriptor_assertions();
  idlArray.enable_attribute_descriptor_assertions();
  idlArray.enable_object_brand_assertions();
  idlArray.add_objects({
    MediaQueryList: ["matchMedia('(prefers-color-scheme: light)')"]
  });
});

test(function () {
  const media = matchMedia("screen and (prefers-color-scheme: light)");
  const calls = [];
  const listener = event => calls.push(["listener", event.type, event.target === media]);
  const legacy = event => calls.push(["legacy", event.type, event.currentTarget === media]);
  media.onchange = event => calls.push(["handler", event.type, event.target === media]);

  assert_true(media instanceof MediaQueryList);
  assert_true(media instanceof EventTarget);
  assert_equals(Object.getPrototypeOf(MediaQueryList.prototype), EventTarget.prototype);
  for (const method of ["addEventListener", "removeEventListener", "dispatchEvent"]) {
    assert_false(Object.prototype.hasOwnProperty.call(MediaQueryList.prototype, method));
    assert_equals(media[method], EventTarget.prototype[method]);
  }
  assert_equals(Object.prototype.toString.call(media), "[object MediaQueryList]");
  assert_false(Object.prototype.hasOwnProperty.call(media, "media"));
  assert_false(Object.prototype.hasOwnProperty.call(media, "matches"));
  assert_false(Object.prototype.hasOwnProperty.call(media, "onchange"));
  assert_equals(media.media, "screen and (prefers-color-scheme: light)");
  assert_true(media.matches);
  assert_equals(typeof media.onchange, "function");

  media.addEventListener("change", listener, { once: true });
  media.addListener(legacy);
  assert_true(media.dispatchEvent(new Event("change")));
  assert_true(media.dispatchEvent(new Event("change")));
  media.removeListener(legacy);
  assert_true(media.dispatchEvent(new Event("change")));

  assert_array_equals(calls[0], ["handler", "change", true]);
  assert_array_equals(calls[1], ["listener", "change", true]);
  assert_array_equals(calls[2], ["legacy", "change", true]);
  assert_array_equals(calls[3], ["handler", "change", true]);
  assert_array_equals(calls[4], ["legacy", "change", true]);
  assert_array_equals(calls[5], ["handler", "change", true]);
  assert_equals(calls.length, 6);
}, "MediaQueryList idlharness sample covers matchMedia state and listener dispatch");

test(function () {
  assert_throws_name("TypeError", () => matchMedia(), "query is required");
  assert_throws_name("TypeError", () => matchMedia(Symbol("query")), "query Symbol conversion should throw");
  assert_throws_name(
    "Error",
    () => matchMedia({ toString() { throw new Error("query failed"); } }),
    "query stringification errors should propagate",
  );
}, "matchMedia uses WebIDL scalar argument conversion");
</script>
