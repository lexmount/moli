<!doctype html>
<meta charset="utf-8">
<div id="root">
  <p id="p1">First paragraph</p>
  <p id="p2">Second paragraph</p>
</div>
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script src="/wpt/resources/WebIDLParser.js"></script>
<script src="/wpt/resources/idlharness.js"></script>
<script>
idl_test([`
interface AbstractRange {
  readonly attribute Node startContainer;
  readonly attribute unsigned long startOffset;
  readonly attribute Node endContainer;
  readonly attribute unsigned long endOffset;
  readonly attribute boolean collapsed;
};

interface Range : AbstractRange {
  constructor();
  readonly attribute Node commonAncestorContainer;
  undefined setStart(Node node, unsigned long offset);
  undefined setEnd(Node node, unsigned long offset);
  undefined setStartBefore(Node node);
  undefined setStartAfter(Node node);
  undefined setEndBefore(Node node);
  undefined setEndAfter(Node node);
  undefined collapse(optional boolean toStart = false);
  undefined selectNode(Node node);
  undefined selectNodeContents(Node node);
  short compareBoundaryPoints(unsigned short how, Range sourceRange);
  undefined deleteContents();
  DocumentFragment extractContents();
  DocumentFragment cloneContents();
  undefined insertNode(Node node);
  undefined surroundContents(Node newParent);
  Range cloneRange();
  boolean isPointInRange(Node node, unsigned long offset);
  short comparePoint(Node node, unsigned long offset);
  boolean intersectsNode(Node node);
  DocumentFragment createContextualFragment(DOMString fragment);
  DOMRect getBoundingClientRect();
  object getClientRects();
  DOMString toString();
};
`], [], function (idlArray) {
  idlArray.enable_function_length_assertions();
  idlArray.enable_interface_descriptor_assertions();
  idlArray.enable_operation_descriptor_assertions();
  idlArray.enable_attribute_descriptor_assertions();
  idlArray.enable_object_brand_assertions();
  idlArray.add_objects({
    Range: ["new Range()", "document.createRange()"]
  });
});

test(function () {
  const range = document.createRange();
  const p1 = document.getElementById("p1");
  range.selectNodeContents(p1);
  assert_false(range.collapsed);
  assert_equals(range.toString(), "First paragraph");
  const clone = range.cloneRange();
  assert_true(clone instanceof Range);
  assert_equals(Object.prototype.toString.call(clone), "[object Range]");
  assert_false(range.hasOwnProperty("startContainer"));
  assert_false(range.hasOwnProperty("startOffset"));
  assert_false(range.hasOwnProperty("endContainer"));
  assert_false(range.hasOwnProperty("endOffset"));
  assert_false(range.hasOwnProperty("collapsed"));
  assert_false(range.hasOwnProperty("commonAncestorContainer"));
  assert_true(
    Object.getPrototypeOf(Range.prototype) === AbstractRange.prototype,
    "Range.prototype should inherit from AbstractRange.prototype"
  );
  clone.collapse();
  assert_true(clone.collapsed);
}, "Range idlharness sample operations work on document-created ranges");
</script>
