[[test.actions]]
type = "evaluate"
expression = '''
window.__lmBadInputNumber = document.getElementById("number");
window.__lmBadInputForm = document.getElementById("form");
window.__lmBadInputInvalidEvents = [];
__lmBadInputNumber.addEventListener("invalid", function () {
  __lmBadInputInvalidEvents.push("invalid");
});
__lmBadInputNumber.focus();
"ready";
'''

[[test.actions]]
type = "insert-text"
text = "abc"

[[test.actions]]
type = "evaluate"
expression = '''
__lmAssertBadInputState(__lmBadInputNumber.value === "", "invalid user-edited number text should expose an empty value");
__lmAssertBadInputState(__lmBadInputNumber.validity.badInput === true, "invalid user-edited number text should set badInput");
__lmAssertBadInputState(__lmBadInputNumber.validity.valid === false, "badInput should make the number input invalid");
__lmAssertBadInputState(__lmBadInputNumber.validationMessage.length > 0, "badInput should expose a validation message");
__lmAssertBadInputState(__lmBadInputForm.checkValidity() === false, "form validation should fail while number input has badInput");
__lmAssertBadInputState(__lmBadInputInvalidEvents.length === 1, "checkValidity should dispatch invalid for badInput");
__lmBadInputNumber.value = "bad";
__lmAssertBadInputState(__lmBadInputNumber.value === "", "script setter after user badInput should still sanitize invalid text");
__lmAssertBadInputState(__lmBadInputNumber.validity.badInput === false, "script setter should clear user badInput provenance");
__lmAssertBadInputState(__lmBadInputNumber.validity.valid === true, "script-set sanitized empty non-required number should be valid");
__lmBadInputNumber.focus();
"ready";
'''

[[test.actions]]
type = "insert-text"
text = "5"

[[test.actions]]
type = "evaluate"
expression = '''
__lmAssertBadInputState(__lmBadInputNumber.value === "5", "valid user-edited number text should update value");
__lmAssertBadInputState(__lmBadInputNumber.validity.badInput === false, "valid user-edited number text should not set badInput");
__lmAssertBadInputState(__lmBadInputNumber.validity.valid === true, "valid number input should be valid");
"done";
'''

