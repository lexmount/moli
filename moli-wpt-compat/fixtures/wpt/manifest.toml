[[test]]
id = "form-constraint-validation-length-user-edit-basic"
upstream = "web-platform-tests/html/semantics/forms/constraints/form-validation-validity-tooShort.html; web-platform-tests/html/semantics/forms/constraints/form-validation-validity-tooLong.html"
upstream_commit = "local-smoke-2026-04-24"
local_path = "ported/forms/form-constraint-validation-length-user-edit-basic.html"
type = "testharness"
global = "window"
status = "pass"
wait_until = "load"
timeout_ms = 5000
suite = "smoke"
tags = ["forms", "html", "validation", "input", "textarea", "length", "actions"]
notes = "Manual compat port for user-edit provenance and editing limits in input/textarea minLength/maxLength validity: script-set values remain exempt, short manifest-driven insert-text actions make tooShort participate in ValidityState.valid, and maxlength truncation counts UTF-16 code units without leaving a split surrogate."

[[test.actions]]
type = "evaluate"
expression = '''
const field = document.getElementById("field");
field.focus();
field.setSelectionRange(0, field.value.length);
"ready";
'''

[[test.actions]]
type = "insert-text"
text = "ab"

[[test.actions]]
type = "evaluate"
expression = '''
__lmAssertLengthState(field.value === "ab", "input action should replace selected value");
__lmAssertLengthState(field.validity.tooShort === true, "user-edited short input should trip tooShort");
__lmAssertLengthState(field.validity.valid === false, "tooShort input should be invalid");
field.setSelectionRange(0, field.value.length);
"ready";
'''

[[test.actions]]
type = "insert-text"
text = "abcde"

[[test.actions]]
type = "evaluate"
expression = '''
__lmAssertLengthState(field.value === "abcd", "input action should truncate to maxlength");
__lmAssertLengthState(field.validity.tooLong === false, "maxlength should prevent a tooLong input value");
__lmAssertLengthState(field.validity.valid === true, "truncated input should remain valid");
field.value = "abcdef";
__lmAssertLengthState(field.validity.tooLong === false, "script-set value after user edit should clear tooLong provenance");
__lmAssertLengthState(field.validity.valid === true, "script-set long input should be valid without user-edit provenance");
"ready";
'''

[[test.actions]]
type = "evaluate"
expression = '''
const bio = document.getElementById("bio");
bio.focus();
bio.setSelectionRange(0, bio.value.length);
"ready";
'''

[[test.actions]]
type = "insert-text"
text = "abcd"

[[test.actions]]
type = "evaluate"
expression = '''
__lmAssertLengthState(bio.value === "abc", "textarea action should truncate to maxlength");
__lmAssertLengthState(bio.validity.tooLong === false, "maxlength should prevent a tooLong textarea value");
__lmAssertLengthState(bio.validity.valid === true, "truncated textarea should remain valid");
const emoji = document.getElementById("emoji");
emoji.focus();
"ready";
'''

[[test.actions]]
type = "insert-text"
text = "😀"

[[test.actions]]
type = "evaluate"
expression = '''
__lmAssertLengthState(emoji.value === "", "maxlength should not leave half of a surrogate pair");
__lmAssertLengthState(emoji.validity.tooLong === false, "rejected non-BMP input should not be tooLong");
__lmAssertLengthState(emoji.validity.valid === true, "rejected non-BMP input should remain valid");
"done";
'''

