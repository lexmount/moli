[package]
name = "moli-layout"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
brotlic = "0.8.2"
euclid = "=0.22.14"
kurbo = "=0.13.1"
moli-image = { path = "../moli-image" }
moli-system-fonts = { path = "../moli-system-fonts" }
# Include dictionary segmentation for Chinese/Japanese and Southeast Asian text.
parley = { version = "=0.11.1", features = ["complex-scripts"] }
stylo = "0.20"
stylo_taffy = { git = "https://github.com/DioxusLabs/blitz", rev = "5081c65811a4396f5a99b2e0aca542a4a4a6606f", default-features = false, features = ["std", "block", "flexbox", "grid", "floats"] }
taffy = { version = "=0.13.0", default-features = false, features = ["std", "block_layout", "flexbox", "grid", "float_layout", "content_size", "calc", "detailed_layout_info"] }
thiserror = "2.0.17"
wuff = { version = "0.2.9", default-features = false, features = ["z"] }

[lints]
workspace = true
