name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from moli/Cargo.toml (for example, 0.1.1)
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: false
        type: boolean
      draft:
        description: Create a draft instead of publishing immediately
        required: true
        default: false
        type: boolean
      publish_npm:
        description: Publish @lexmount/moli after creating a non-draft release
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: ${{ github.workspace }}

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and tag
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PUBLISH_NPM: ${{ inputs.publish_npm }}
        run: |
          set -euo pipefail

          if [[ "$INPUT_DRAFT" == true && "$INPUT_PUBLISH_NPM" == true ]]; then
            echo "npm publishing cannot be enabled for a draft release." >&2
            exit 1
          fi

          version="${INPUT_VERSION#v}"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver_pattern ]]; then
            echo "Invalid semantic version: $INPUT_VERSION" >&2
            exit 1
          fi

          manifest_version=$(awk '$1 == "version" && $2 == "=" { gsub(/"/, "", $3); print $3; exit }' moli/Cargo.toml)
          if [[ "$version" != "$manifest_version" ]]; then
            echo "Requested version $version does not match moli/Cargo.toml ($manifest_version)." >&2
            exit 1
          fi

          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux x86_64
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: rust:1.96.1-bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install packaging dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends binutils python3

      - name: Validate shell installer
        shell: bash
        run: sh -n scripts/install.sh

      - name: Build and package
        shell: bash
        run: >-
          python3 scripts/release.py
          --version "${{ needs.validate.outputs.version }}"
          --expected-target x86_64-unknown-linux-gnu

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x86_64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: release-macos-x86_64
          - arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            artifact: release-macos-aarch64
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(tr -d '[:space:]' < rust-toolchain)
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustc --version

      - name: Build and package
        shell: bash
        run: >-
          python3 scripts/release.py
          --version "${{ needs.validate.outputs.version }}"
          --expected-target "${{ matrix.target }}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-windows:
    name: Build Windows x86_64
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $toolchain = (Get-Content rust-toolchain -Raw).Trim()
          rustup toolchain install $toolchain --profile minimal --no-self-update
          rustc --version

      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1),
            [ref] $tokens,
            [ref] $parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Build and package
        shell: pwsh
        run: >-
          python scripts/release.py
          --version "${{ needs.validate.outputs.version }}"
          --expected-target x86_64-pc-windows-msvc

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x86_64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package-npm:
    name: Package npm CLI
    needs:
      - validate
      - build-linux
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0

      - name: Download native release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Test npm launcher
        run: npm test --prefix npm

      - name: Build npm packages
        run: >-
          python3 scripts/package_npm.py
          --version "${{ needs.validate.outputs.version }}"
          --input-dir dist
          --output-dir dist/npm

      - name: Validate npm publish contents
        run: >-
          python3 scripts/publish_npm.py
          dist/npm/npm-packages.json
          --main-tag latest
          --dry-run

      - name: Smoke-test packaged Linux CLI
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          smoke_dir=$(mktemp -d "${RUNNER_TEMP}/moli-npm-smoke.XXXXXX")
          trap 'rm -rf "$smoke_dir"' EXIT
          manifest=dist/npm/npm-packages.json
          main_tarball=$(jq -r '.main.filename' "$manifest")
          linux_tarball=$(jq -r \
            '.platforms[] | select(.target == "x86_64-unknown-linux-gnu") | .filename' \
            "$manifest")
          main_root="$smoke_dir/node_modules/@lexmount/moli"
          platform_root="$smoke_dir/node_modules/@lexmount/moli-linux-x64"
          mkdir -p "$main_root" "$platform_root"
          tar -xzf "dist/npm/$main_tarball" -C "$main_root" --strip-components=1
          tar -xzf "dist/npm/$linux_tarball" -C "$platform_root" --strip-components=1

          reported_version=$(node "$main_root/bin/moli.js" --version)
          if [[ "$reported_version" != "moli $RELEASE_VERSION" ]]; then
            echo "Unexpected packaged CLI version: $reported_version" >&2
            exit 1
          fi

      - name: Upload npm packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: dist/npm/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Create GitHub Release
    needs:
      - validate
      - build-linux
      - build-macos
      - build-windows
      - package-npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Add stable installers
        shell: bash
        run: |
          install -m 0755 scripts/install.sh dist/moli-installer.sh
          install -m 0644 scripts/install.ps1 dist/moli-installer.ps1

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          expected_archives=(
            "moli-x86_64-unknown-linux-gnu.tar.gz"
            "moli-x86_64-apple-darwin.tar.gz"
            "moli-aarch64-apple-darwin.tar.gz"
            "moli-x86_64-pc-windows-msvc.zip"
          )
          for archive in "${expected_archives[@]}"; do
            test -f "dist/$archive"
          done
          test -f dist/moli-installer.sh
          test -f dist/moli-installer.ps1
          sh -n dist/moli-installer.sh

          artifact_count=$(find dist -maxdepth 1 -type f | wc -l)
          if [[ "$artifact_count" -ne 6 ]]; then
            echo "Expected 6 release assets, found $artifact_count." >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          assets=(dist/*)
          args=(
            release create "$RELEASE_TAG"
            "${assets[@]}"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "Moli $RELEASE_TAG"
            --generate-notes
          )
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            args+=(--prerelease)
          elif [[ "$RELEASE_DRAFT" != true ]]; then
            args+=(--latest)
          fi
          if [[ "$RELEASE_DRAFT" == true ]]; then
            args+=(--draft)
          fi

          release_url=$(gh "${args[@]}")
          printf 'Created %s\n' "$release_url"
          printf '### Release created\n\n[%s](%s)\n' \
            "$RELEASE_TAG" "$release_url" >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    name: Publish npm CLI
    if: ${{ inputs.publish_npm && !inputs.draft }}
    needs:
      - validate
      - package-npm
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - name: Download npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: dist/npm

      - name: Verify trusted-publishing client versions
        shell: bash
        run: |
          node --version
          npm --version

      - name: Publish platform packages, then launcher
        shell: bash
        env:
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          main_tag=latest
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            main_tag=next
          fi
          python3 scripts/publish_npm.py \
            dist/npm/npm-packages.json \
            --main-tag "$main_tag" \
            --trusted-publishing
