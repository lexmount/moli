name: molio CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: &build_paths
      - client/**
      - moli-*/**
      - '!moli-benchmark/**'
      - '!moli-*-smoke/**'
      - '!moli-playground/**'
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain
      - .cargo/**
      - .config/nextest.toml
      - .github/workflows/molio-ci.yml
  push:
    branches:
      - main
    paths: *build_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: molio-ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: molio Linux
    runs-on: ubuntu-latest
    container: rust:1.100.0-bookworm
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt -p molio -p molio-ios -p molio-ohos --check

      - name: Install desktop build dependencies
        run: |
          set -eu
          apt-get update
          apt-get install --yes --no-install-recommends cmake libclang-dev pkg-config \
            libfontconfig1-dev libwayland-dev libx11-dev libxcb1-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Check Clippy
        run: >-
          cargo clippy --locked -p molio -p moli-core -p moli-renderer-v8
          --all-targets --all-features -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: nextest@0.9.132

      - name: Run desktop tests
        run: cargo nextest run --locked -p molio -p moli-core --bins --test viewport --profile ci
