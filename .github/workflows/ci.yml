name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  iframe-diagnostic:
    name: Exact Linux iframe diagnostic
    runs-on: ubuntu-latest
    container: rust:1.96.1-bookworm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f90c747f887b3f894c647c2214d95168e09abd0b
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: moli-release-head
          run-id: 35692440300
          github-token: ${{ github.token }}
          path: diagnostic-binary
      - name: Extract exact CI binary
        run: |
          tar -xzf diagnostic-binary/moli-release-head.tar.gz -C diagnostic-binary
          chmod +x diagnostic-binary/moli-release-head/moli
          cat diagnostic-binary/moli-release-head/revision.txt
          diagnostic-binary/moli-release-head/moli --version
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.14
          python-version: '3.12'
      - name: Repeat only the failed iframe group
        env:
          MOLI_BIN: ${{ github.workspace }}/diagnostic-binary/moli-release-head/moli
          DEBUG: pw:api
          MOLI_SMOKE_TRACE_BG: '1'
        run: uv run --project moli-cdp-smoke --locked moli-cdp-smoke --group iframe-input --repeat 8 --jobs 4 --timeout 120 --output-dir diagnostic-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-linux-iframe-diagnostic
          path: diagnostic-results
