name: Exact full-workspace Nextest

on:
  workflow_dispatch:
    inputs:
      head_ref:
        description: Upstream draft PR ref, for example refs/pull/123/head
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  exact-nextest:
    runs-on: [self-hosted, moli-nextest]
    container:
      image: rust:1.100.0-bookworm
      volumes:
        - moli-ci-cargo-home-1-96-1-v1:/usr/local/cargo
        - moli-ci-rustup-home-1-96-1-v1:/usr/local/rustup
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lexmount/moli
          ref: ${{ inputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact candidate
        shell: bash
        env:
          HEAD_REF: ${{ inputs.head_ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$HEAD_REF" =~ ^refs/pull/[0-9]+/head$ ]]; then
            printf 'head_ref must be an upstream pull-request head ref\n' >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'expected_head_sha must be a lowercase 40-character SHA\n' >&2
            exit 1
          fi

          resolved_head=$(git rev-parse HEAD)
          if [[ "$resolved_head" != "$EXPECTED_HEAD_SHA" ]]; then
            printf 'resolved head does not match expected_head_sha\n' >&2
            exit 1
          fi
          printf 'Validated exact candidate %s\n' "$resolved_head"

      - name: Install exact build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E \
            's#https?://(deb|security)\.debian\.org/#https://mirrors.tuna.tsinghua.edu.cn/#g' \
            /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install --yes --no-install-recommends \
            cmake libclang-dev pkg-config time \
            libfontconfig1-dev libwayland-dev libx11-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: nextest@0.9.132

      - name: Run exact full-workspace Nextest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exact-nextest-evidence

          status=0
          bash -euo pipefail -c '
            git rev-parse HEAD
            rustc --version --verbose
            cargo --version
            cargo nextest --version
            /usr/bin/time -v cargo nextest run --locked --workspace --no-fail-fast \
              --test-threads 2 --retries 0
          ' 2>&1 | tee exact-nextest-evidence/run.log || status=$?
          printf 'exit_status=%s\n' "$status" | tee -a exact-nextest-evidence/run.log
          exit "$status"

      - name: Upload exact qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-nextest-${{ inputs.expected_head_sha }}
          path: exact-nextest-evidence/run.log
          if-no-files-found: error
          retention-days: 30
