[package]
license.workspace = true
name = "moli-webtransport"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytes = "1"
futures-util = "0.3"
http = "1"
moli-curl = { path = "../moli-curl" }
moli-dns-resolver = { path = "../moli-dns-resolver" }
parking_lot = "0.12"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio = { version = "1.51.0", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
url = "2.5.7"
web-transport-quinn = { version = "=0.13.5", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3"
tokio = { version = "1.51.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
