[package]
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
name = "moli-leveldb-parser"
version = "0.1.0"
edition = "2024"
description = "Read-only LevelDB snapshot reader"

[dependencies]
anyhow = "1.0.100"
crc32c = "0.6.8"
snap = "1.1.1"
zerocopy = { version = "0.8.46", default-features = false, features = ["derive"] }

[dev-dependencies]
# Generate database fixtures and compare snapshot contents with an independent engine.
rusty-leveldb = "4.0.1"
tempfile = "3.23.0"

[lints]
workspace = true
