<!doctype html>
<html>
  <body data-order="" data-count="" data-ready-status="">
    <script>
      const body = document.body;
      const events = [];

      document.fonts.onloading = (event) => events.push(event.type);
      document.fonts.onloadingdone = (event) => events.push(event.type);
      document.fonts.onloadingerror = (event) => events.push(event.type);
      const done = new Promise(resolve => document.fonts.addEventListener('loadingdone', resolve, {once: true}));
      document.fonts.add(new FontFace('FixtureFace', 'url(/compat/font.ttf)'));

      globalThis.fontFixtureDone = document.fonts
        .load('10px FixtureFace')
        .then(() => document.fonts.ready)
        .then(() => done)
        .then(() => {
          body.setAttribute('data-order', events.join(','));
          body.setAttribute('data-count', String(events.length));
          body.setAttribute('data-ready-status', document.fonts.status);
        });
    </script>
  </body>
</html>
