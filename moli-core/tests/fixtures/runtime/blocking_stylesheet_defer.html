<!doctype html>
<html>
  <head>
    <script>
      window.blockingStylesheetDeferOrder = [];
      document.addEventListener("DOMContentLoaded", () => {
        window.blockingStylesheetDeferDclSawStylesheet =
          getComputedStyle(document.documentElement).color === "rgb(1, 2, 3)";
        window.blockingStylesheetDeferOrder.push("dcl");
        window.blockingStylesheetDeferDclOrder =
          window.blockingStylesheetDeferOrder.join(",");
      });
    </script>
    <link rel="stylesheet" href="/assets/blocking_stylesheet_slow.css">
    <script defer src="/assets/blocking_stylesheet_defer.js"></script>
  </head>
  <body>
    <div id="late">late</div>
  </body>
</html>
