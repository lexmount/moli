<!doctype html>
<html>
  <body>
    <iframe id="child" src="/compat/window-child-browsing-context-target-name-a"></iframe>
    <script>
      const iframe = document.getElementById('child');
      const childWindow = iframe.contentWindow;
      const childDocument = iframe.contentDocument;
      const requestedMode = new URL(window.location.href).searchParams.get('mode');
      const mode =
        requestedMode === 'href' ||
        requestedMode === 'window-location' ||
        requestedMode === 'document-location'
          ? requestedMode
          : 'assign-replace';
      const topHrefBefore = window.location.href;
      const topHistoryBefore = window.history.length;
      const childHistoryBefore = childWindow.history.length;
      const initialChildUrl = childWindow.location.href;
      const targetPath =
        mode === 'assign-replace'
          ? '/compat/window-child-browsing-context-delayed-child?replaced=1'
          : `/compat/window-child-browsing-context-delayed-child?mode=${mode}`;
      const targetUrl = new URL(targetPath, window.location.href).href;

      iframe.addEventListener('load', () => {
        const loadedDocument = iframe.contentDocument;
        if (loadedDocument?.body?.getAttribute('data-child') !== 'delayed') {
          return;
        }
        document.body.setAttribute(
          'data-window-same-after-load',
          String(childWindow === iframe.contentWindow)
        );
        document.body.setAttribute(
          'data-document-replaced-after-load',
          String(childDocument !== iframe.contentDocument)
        );
        document.body.setAttribute(
          'data-window-document-same-after-load',
          String(iframe.contentWindow.document === iframe.contentDocument)
        );
        document.body.setAttribute(
          'data-document-default-view-same-after-load',
          String(iframe.contentDocument.defaultView === iframe.contentWindow)
        );
        document.body.setAttribute(
          'data-default-view-document-same-after-load',
          String(iframe.contentDocument.defaultView.document === iframe.contentDocument)
        );
        document.body.setAttribute(
          'data-child-document-url-after-load',
          iframe.contentDocument.URL
        );
        document.body.setAttribute(
          'data-child-document-location-after-load',
          iframe.contentWindow.document.location.href
        );
        document.body.setAttribute(
          'data-child-document-text-after-load',
          iframe.contentDocument.body.getAttribute('data-child') ?? 'null'
        );
      });

      document.body.setAttribute('data-mode', mode);
      if (mode === 'assign-replace') {
        childWindow.location.assign('/compat/window-child-browsing-context-target-name-b');
        childWindow.location.replace(targetPath);
      } else if (mode === 'href') {
        childWindow.location.href = targetPath;
      } else if (mode === 'window-location') {
        childWindow.location = targetPath;
      } else {
        childWindow.document.location = targetPath;
      }

      document.body.setAttribute(
        'data-top-location-unchanged',
        String(window.location.href === topHrefBefore)
      );
      document.body.setAttribute(
        'data-top-history-unchanged',
        String(window.history.length === topHistoryBefore)
      );
      document.body.setAttribute(
        'data-child-history-unchanged',
        String(childWindow.history.length === childHistoryBefore)
      );
      document.body.setAttribute(
        'data-child-current-entry-index',
        String(childWindow.navigation.currentEntry?.index ?? -1)
      );
      document.body.setAttribute(
        'data-child-current-entry-url',
        childWindow.navigation.currentEntry?.url ?? 'null'
      );
      document.body.setAttribute(
        'data-child-history-state-null',
        String(childWindow.history.state === null)
      );
      document.body.setAttribute(
        'data-child-location-href',
        childWindow.location.href
      );
      document.body.setAttribute(
        'data-window-same-immediate',
        String(childWindow === iframe.contentWindow)
      );
      document.body.setAttribute(
        'data-document-same-immediate',
        String(childDocument === iframe.contentDocument)
      );
      document.body.setAttribute(
        'data-window-document-same-immediate',
        String(iframe.contentWindow.document === iframe.contentDocument)
      );
      document.body.setAttribute(
        'data-document-default-view-same-immediate',
        String(iframe.contentDocument.defaultView === iframe.contentWindow)
      );
      document.body.setAttribute(
        'data-default-view-document-same-immediate',
        String(iframe.contentDocument.defaultView.document === iframe.contentDocument)
      );
      document.body.setAttribute(
        'data-child-document-location-immediate',
        childWindow.document.location.href
      );
      document.body.setAttribute(
        'data-child-document-url-immediate',
        childWindow.document.URL
      );
      document.body.setAttribute(
        'data-child-document-still-committed-immediate',
        String(childWindow.document.URL === initialChildUrl)
      );

      queueMicrotask(() => {
        document.body.setAttribute(
          'data-window-same-pending-microtask',
          String(childWindow === iframe.contentWindow)
        );
        document.body.setAttribute(
          'data-document-same-pending-microtask',
          String(childDocument === iframe.contentDocument)
        );
        document.body.setAttribute(
          'data-window-document-same-pending-microtask',
          String(iframe.contentWindow.document === iframe.contentDocument)
        );
        document.body.setAttribute(
          'data-document-default-view-same-pending-microtask',
          String(iframe.contentDocument.defaultView === iframe.contentWindow)
        );
        document.body.setAttribute(
          'data-default-view-document-same-pending-microtask',
          String(iframe.contentDocument.defaultView.document === iframe.contentDocument)
        );
        document.body.setAttribute(
          'data-child-location-pending-microtask',
          childWindow.location.href
        );
        document.body.setAttribute(
          'data-child-document-location-pending-microtask',
          childWindow.document.location.href
        );
        document.body.setAttribute(
          'data-child-document-url-pending-microtask',
          childWindow.document.URL
        );
        document.body.setAttribute(
          'data-child-document-still-committed-pending-microtask',
          String(childWindow.document.URL === initialChildUrl)
        );
        document.body.setAttribute(
          'data-child-location-target-pending-microtask',
          String(childWindow.location.href === targetUrl)
        );
      });
    </script>
  </body>
</html>
