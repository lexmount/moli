<!doctype html>
<html>
  <body
    data-tampered-split-text-called="no"
    data-tampered-insert-before-called="no"
    data-tampered-append-child-called="no"
    data-tampered-clone-node-called="no"
    data-tampered-remove-child-called="no"
    data-tampered-delete-data-called="no"
    data-tampered-create-text-node-called="no"
    data-tampered-create-comment-called="no"
    data-tampered-create-document-fragment-called="no"
    data-tampered-create-element-called="no"
    data-tampered-get-bounding-client-rect-called="no"
    data-tampered-get-client-rects-called="no"
  >
    <p id="insert-host">hello world</p>
    <p id="surround-host"><span id="wrap-a">one</span><span id="wrap-b">two</span></p>
    <p id="clone-host"><span id="clone-a">one</span><span id="clone-b">two</span></p>
    <p id="extract-host">hello<strong id="extract-mid">mid</strong>tail</p>
    <p id="delete-host">abcdef</p>
    <div id="comment-host"><!--commentary--></div>
    <div id="context-host">seed text</div>
    <div id="geometry-target" style="width: 120px; height: 40px"><span>box</span></div>
    <script>
      const body = document.body;
      const insertHost = document.getElementById("insert-host");
      const surroundHost = document.getElementById("surround-host");
      const cloneHost = document.getElementById("clone-host");
      const extractHost = document.getElementById("extract-host");
      const deleteHost = document.getElementById("delete-host");
      const commentHost = document.getElementById("comment-host");
      const contextHost = document.getElementById("context-host");
      const geometryTarget = document.getElementById("geometry-target");
      const realCreateElement = document.createElement.bind(document);

      Text.prototype.splitText = function () {
        body.setAttribute("data-tampered-split-text-called", "yes");
        throw new Error("page tampered Text.prototype.splitText");
      };
      Node.prototype.insertBefore = function () {
        body.setAttribute("data-tampered-insert-before-called", "yes");
        throw new Error("page tampered Node.prototype.insertBefore");
      };
      Node.prototype.appendChild = function () {
        body.setAttribute("data-tampered-append-child-called", "yes");
        throw new Error("page tampered Node.prototype.appendChild");
      };
      Node.prototype.cloneNode = function () {
        body.setAttribute("data-tampered-clone-node-called", "yes");
        throw new Error("page tampered Node.prototype.cloneNode");
      };
      Node.prototype.removeChild = function () {
        body.setAttribute("data-tampered-remove-child-called", "yes");
        throw new Error("page tampered Node.prototype.removeChild");
      };
      CharacterData.prototype.deleteData = function () {
        body.setAttribute("data-tampered-delete-data-called", "yes");
        throw new Error("page tampered CharacterData.prototype.deleteData");
      };
      Document.prototype.createTextNode = function () {
        body.setAttribute("data-tampered-create-text-node-called", "yes");
        throw new Error("page tampered Document.prototype.createTextNode");
      };
      Document.prototype.createComment = function () {
        body.setAttribute("data-tampered-create-comment-called", "yes");
        throw new Error("page tampered Document.prototype.createComment");
      };
      Document.prototype.createDocumentFragment = function () {
        body.setAttribute("data-tampered-create-document-fragment-called", "yes");
        throw new Error("page tampered Document.prototype.createDocumentFragment");
      };
      Document.prototype.createElement = function () {
        body.setAttribute("data-tampered-create-element-called", "yes");
        throw new Error("page tampered Document.prototype.createElement");
      };
      Element.prototype.getBoundingClientRect = function () {
        body.setAttribute("data-tampered-get-bounding-client-rect-called", "yes");
        throw new Error("page tampered Element.prototype.getBoundingClientRect");
      };
      Element.prototype.getClientRects = function () {
        body.setAttribute("data-tampered-get-client-rects-called", "yes");
        throw new Error("page tampered Element.prototype.getClientRects");
      };

      try {
        const range = document.createRange();
        range.setStart(insertHost.firstChild, 5);
        range.collapse(true);
        const inserted = realCreateElement("strong");
        inserted.id = "inserted";
        inserted.textContent = "X";
        range.insertNode(inserted);
        body.setAttribute("data-insert-first-text", insertHost.childNodes[0].data);
        body.setAttribute("data-insert-middle-tag", insertHost.childNodes[1].tagName);
        body.setAttribute("data-insert-middle-id", insertHost.childNodes[1].id);
        body.setAttribute("data-insert-last-text", insertHost.childNodes[2].data);
      } catch (error) {
        body.setAttribute("data-insert-error", String(error));
      }

      try {
        const range = document.createRange();
        range.selectNodeContents(surroundHost);
        const wrapper = realCreateElement("em");
        wrapper.id = "wrapped";
        range.surroundContents(wrapper);
        body.setAttribute("data-surround-wrapper-tag", surroundHost.firstChild.tagName);
        body.setAttribute("data-surround-wrapper-id", surroundHost.firstChild.id);
        body.setAttribute(
          "data-surround-wrapper-child-count",
          String(surroundHost.firstChild.childNodes.length),
        );
        body.setAttribute(
          "data-surround-first-child-id",
          surroundHost.firstChild.childNodes[0].id,
        );
        body.setAttribute(
          "data-surround-last-child-id",
          surroundHost.firstChild.childNodes[1].id,
        );
      } catch (error) {
        body.setAttribute("data-surround-error", String(error));
      }

      try {
        const range = document.createRange();
        range.selectNodeContents(cloneHost);
        const fragment = range.cloneContents();
        body.setAttribute("data-clone-child-count", String(fragment.childNodes.length));
        body.setAttribute("data-clone-first-tag", fragment.childNodes[0]?.tagName ?? "");
        body.setAttribute("data-clone-first-id", fragment.childNodes[0]?.id ?? "");
        body.setAttribute("data-clone-second-id", fragment.childNodes[1]?.id ?? "");
      } catch (error) {
        body.setAttribute("data-clone-error", String(error));
      }

      try {
        const range = document.createRange();
        range.setStart(extractHost.firstChild, 0);
        range.setEnd(extractHost.lastChild, extractHost.lastChild.data.length);
        const fragment = range.extractContents();
        body.setAttribute("data-extract-child-count", String(fragment.childNodes.length));
        body.setAttribute("data-extract-first-text", fragment.childNodes[0]?.data ?? "");
        body.setAttribute("data-extract-middle-tag", fragment.childNodes[1]?.tagName ?? "");
        body.setAttribute("data-extract-middle-id", fragment.childNodes[1]?.id ?? "");
        body.setAttribute("data-extract-last-text", fragment.childNodes[2]?.data ?? "");
        body.setAttribute("data-extract-host-text", extractHost.textContent);
      } catch (error) {
        body.setAttribute("data-extract-error", String(error));
      }

      try {
        const range = document.createRange();
        range.setStart(deleteHost.firstChild, 1);
        range.setEnd(deleteHost.firstChild, 4);
        const fragment = range.extractContents();
        body.setAttribute("data-delete-fragment-text", fragment.textContent);
        body.setAttribute("data-delete-host-text", deleteHost.textContent);
      } catch (error) {
        body.setAttribute("data-delete-error", String(error));
      }

      try {
        const range = document.createRange();
        const comment = commentHost.firstChild;
        range.setStart(comment, 2);
        range.setEnd(comment, 8);
        const fragment = range.cloneContents();
        body.setAttribute("data-comment-clone-text", fragment.firstChild?.data ?? "");
      } catch (error) {
        body.setAttribute("data-comment-clone-error", String(error));
      }

      try {
        const range = document.createRange();
        range.setStart(contextHost.firstChild, 2);
        range.collapse(true);
        const fragment = range.createContextualFragment("<b>Bold</b><i>Italic</i>");
        body.setAttribute("data-context-child-count", String(fragment.childNodes.length));
        body.setAttribute("data-context-first-tag", fragment.childNodes[0]?.tagName ?? "");
        body.setAttribute("data-context-second-tag", fragment.childNodes[1]?.tagName ?? "");
      } catch (error) {
        body.setAttribute("data-context-error", String(error));
      }

      globalThis.runGeometryProbe = () => {
      try {
        const range = document.createRange();
        range.selectNodeContents(geometryTarget);
        const rect = range.getBoundingClientRect();
        const rects = range.getClientRects();
        body.setAttribute("data-rect-width", String(rect.width));
        body.setAttribute("data-rect-height", String(rect.height));
        body.setAttribute("data-rects-length", String(rects.length));
        body.setAttribute("data-rects-first-width", String(rects[0]?.width ?? -1));
      } catch (error) {
        body.setAttribute("data-geometry-error", String(error));
      }
      };
    </script>
  </body>
</html>
