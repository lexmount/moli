<!doctype html>
<html>
  <body
    data-window-same="pending"
    data-location-updated="pending"
    data-document-updated="pending"
    data-listener-preserved="pending"
  >
    <script>
      const iframe = document.createElement('iframe');
      iframe.id = 'child';
      iframe.src = 'about:blank';
      let child = null;
      let loadCount = 0;
      iframe.addEventListener('load', () => {
        loadCount += 1;
        if (loadCount === 1) {
          iframe.src = '/compat/window-child-browsing-context-target-name-a';
          return;
        }
        document.body.dataset.windowSame = String(child === iframe.contentWindow);
        document.body.dataset.locationUpdated = String(
          iframe.contentWindow?.location?.href ?? 'null'
        );
        document.body.dataset.documentUpdated = String(
          iframe.contentWindow?.document?.body?.textContent?.trim() ?? 'null'
        );
        iframe.contentWindow?.postMessage('kept', '*');
      });
      document.body.appendChild(iframe);
      child = iframe.contentWindow;
      if (!child) {
        document.body.dataset.windowSame = 'no-child';
      } else {
        child.addEventListener('message', (event) => {
          document.body.dataset.listenerPreserved = String(event.data);
        });
      }
    </script>
  </body>
</html>
