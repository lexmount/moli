<!doctype html>
<html>
  <body>
    <script>
      window.parserOwnedModuleTlaPayloadOrder = [];
      window.addEventListener("error", (event) => {
        window.parserOwnedModuleTlaPayloadOrder.push("window-error");
        window.parserOwnedModuleTlaPayloadErrorMessageMatches = Boolean(
          typeof event.message === "string" && event.message.length > 0,
        );
        window.parserOwnedModuleTlaPayloadErrorIdentityMatches =
          event.error === window.parserOwnedModuleTlaPayloadReason &&
          Object.getPrototypeOf(event.error) === null &&
          !Object.hasOwn(event.error, "message") &&
          !Object.hasOwn(event.error, "fileName");
        window.parserOwnedModuleTlaPayloadFilenameMatches =
          typeof event.filename === "string" &&
          event.filename.includes(
            "/compat/parser-owned-module-tla-exotic-rejection-reports-window-error-payload-before-later-module",
          );
      });
    </script>
    <script
      type="module"
      onerror="window.parserOwnedModuleTlaPayloadOrder.push('script-error');"
    >
      const reason = window.parserOwnedModuleTlaPayloadReason = Object.create(null);
      await Promise.reject(reason);
    </script>
    <script type="module">
      window.parserOwnedModuleTlaPayloadOrder.push("later-module");
      window.parserOwnedModuleTlaPayloadContinuation = true;
      window.parserOwnedModuleTlaPayloadOrderResult =
        window.parserOwnedModuleTlaPayloadOrder.join(",");
    </script>
  </body>
</html>
