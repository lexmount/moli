<!doctype html>
<html>
  <body>
    <script>
      window.parserImportMapAfterDynamicModuleErrors = 0;
      window.addEventListener("error", () => {
        window.parserImportMapAfterDynamicModuleErrors += 1;
      });

      const dynamicModule = document.createElement('script');
      dynamicModule.type = 'module';
      dynamicModule.textContent = 'window.dynamicModuleQueuedBeforeLateParserImportMap = true;';
      document.head.appendChild(dynamicModule);
      window.dynamicModulePrepareBarrierInstalled = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "late-parser-map": "/assets/importmap-extra-target.mjs"
        }
      }
    </script>
    <script type="module">
      import { label } from "late-parser-map";
      window.parserImportMapAfterDynamicModuleLabel = label;
    </script>
    <script>
      window.parserImportMapAfterDynamicModuleDone = true;
    </script>
  </body>
</html>
