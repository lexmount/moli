<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      window.runtimeOwnedAsyncFastOrder = [];
      window.runtimeOwnedAsyncClassicOrder = window.runtimeOwnedAsyncFastOrder;
      const script = document.createElement("script");
      script.src = "/assets/runtime_owned_async_fast.js";
      script.onload = () => {
        window.runtimeOwnedAsyncFastOrder.push("load:" + document.readyState);
        window.runtimeOwnedAsyncFastLoadOrder =
          window.runtimeOwnedAsyncFastOrder.join(",");
        if (window.runtimeOwnedAsyncFastTailGated) {
          fetch('/assets/runtime_owned_async_fast_executed');
        }
      };
      document.head.appendChild(script);
      window.runtimeOwnedAsyncFastOrder.push("after-append:async=" + script.async);
      document.addEventListener("DOMContentLoaded", () => {
        window.runtimeOwnedAsyncFastOrder.push("dcl:" + document.readyState);
        window.runtimeOwnedAsyncFastDclOrder =
          window.runtimeOwnedAsyncFastOrder.join(",");
      });
      window.addEventListener("load", () => {
        window.runtimeOwnedAsyncFastOrder.push("window-load:" + document.readyState);
        window.runtimeOwnedAsyncFastFinalOrder =
          window.runtimeOwnedAsyncFastOrder.join(",");
      });
    </script>
  </head>
  <body>
    <main id="late">late</main>
  </body>
</html>
