<!doctype html>
<html>
  <body>
    <iframe id="child" src="/compat/window-child-browsing-context-target-name-a"></iframe>
    <script>
      const iframe = document.getElementById('child');
      const topOrder = [];
      const childOrder = [];

      window.addEventListener('popstate', () => topOrder.push('top-popstate'));
      window.addEventListener('hashchange', () => topOrder.push('top-hashchange'));

      iframe.addEventListener('load', () => {
        if (document.body.hasAttribute('data-done')) {
          return;
        }
        document.body.setAttribute('data-done', '1');

        const childWindow = iframe.contentWindow;
        let finishTraversal;

        childWindow.addEventListener('popstate', () => {
          childOrder.push('child-popstate');
          queueMicrotask(() => childOrder.push('child-popstate-microtask'));
        });

        childWindow.addEventListener('hashchange', (event) => {
          childOrder.push('child-hashchange');
          document.body.setAttribute('data-child-old', event.oldURL);
          document.body.setAttribute('data-child-new', event.newURL);
          queueMicrotask(() => {
            childOrder.push('child-hashchange-microtask');
            finishTraversal?.();
          });
        });

        childWindow.history.pushState(null, '', '#one');
        childWindow.history.pushState(null, '', '#two');

        setTimeout(() => {
          topOrder.length = 0;
          childOrder.length = 0;
          document.body.removeAttribute('data-child-old');
          document.body.removeAttribute('data-child-new');

          const traversalCompleted = new Promise(resolve => {
            finishTraversal = resolve;
          });
          childWindow.history.back();
          document.body.setAttribute('data-child-sync-hash', childWindow.location.hash);

          traversalCompleted.then(() => {
            setTimeout(() => {
              document.body.setAttribute('data-top-order', topOrder.join(','));
              document.body.setAttribute('data-child-order', childOrder.join(','));
              document.body.setAttribute('data-child-timeout-hash', childWindow.location.hash);
            }, 50);
          });
        }, 50);
      });
    </script>
  </body>
</html>
