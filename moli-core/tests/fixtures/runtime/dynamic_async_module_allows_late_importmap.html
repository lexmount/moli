<!doctype html>
<html>
  <head>
    <script>
      window.dynamicAsyncImportMapErrors = 0;
      window.addEventListener("error", () => {
        window.dynamicAsyncImportMapErrors += 1;
      });

      const firstModule = document.createElement("script");
      firstModule.type = "module";
      firstModule.async = true;
      firstModule.src = "/assets/dynamic_async_module_acquisition_barrier.mjs";
      document.head.appendChild(firstModule);

      const lateMap = document.createElement("script");
      lateMap.type = "importmap";
      lateMap.text = JSON.stringify({
        imports: {
          late: "/assets/importmap-extra-target.mjs",
        },
      });
      lateMap.addEventListener("load", () => {
        window.dynamicAsyncImportMapLoads =
          (window.dynamicAsyncImportMapLoads || 0) + 1;
      });
      document.head.appendChild(lateMap);

      const lateModule = document.createElement("script");
      lateModule.type = "module";
      lateModule.text = `
        import { label } from "late";
        window.dynamicAsyncImportMapLabel = label;
      `;
      document.head.appendChild(lateModule);
    </script>
  </head>
</html>
