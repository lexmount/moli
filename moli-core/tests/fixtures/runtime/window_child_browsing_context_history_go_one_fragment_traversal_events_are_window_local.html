<!doctype html>
<html>
  <body>
    <iframe id="child" src="/compat/window-child-browsing-context-target-name-a"></iframe>
    <script>
      const iframe = document.getElementById('child');
      const topOrder = [];
      let topCurrentEntryChanges = 0;

      window.addEventListener('popstate', () => topOrder.push('top-popstate'));
      window.addEventListener('hashchange', () => topOrder.push('top-hashchange'));
      window.navigation.addEventListener('currententrychange', () => {
        topCurrentEntryChanges += 1;
      });

      iframe.addEventListener(
        'load',
        () => {
          const childWindow = iframe.contentWindow;
          const childOrder = [];
          const childPropertyOrder = [];

          childWindow.addEventListener('popstate', (event) => {
            childOrder.push('child-popstate:' + String(event.state?.step ?? 'null'));
            queueMicrotask(() => {
              childOrder.push(
                'child-popstate-microtask:' +
                  String(childWindow.history.state?.step ?? 'null')
              );
            });
          });

          childWindow.addEventListener('hashchange', (event) => {
            childOrder.push('child-hashchange');
            document.body.setAttribute('data-child-old', event.oldURL);
            document.body.setAttribute('data-child-new', event.newURL);
          });

          childWindow.history.pushState({ step: 1 }, '', '#one');
          childWindow.history.pushState({ step: 2 }, '', '#two');

          setTimeout(() => {
            topOrder.length = 0;
            topCurrentEntryChanges = 0;
            childOrder.length = 0;
            childPropertyOrder.length = 0;
            document.body.removeAttribute('data-child-old');
            document.body.removeAttribute('data-child-new');

            childWindow.addEventListener(
              'hashchange',
              function onHashchange() {
                if (childWindow.location.hash !== '#one') {
                  return;
                }

                childOrder.length = 0;
                childPropertyOrder.length = 0;
                childWindow.navigation.addEventListener(
                  'currententrychange',
                  (event) => {
                    childOrder.push('child-currententrychange');
                    queueMicrotask(() => {
                      childOrder.push(
                        'child-currententrychange-microtask:' +
                          childWindow.location.hash +
                          ':' +
                          String(childWindow.history.state?.step ?? 'null')
                      );
                    });
                    document.body.setAttribute(
                      'data-child-from-url',
                      event.from?.url ?? 'null'
                    );
                    document.body.setAttribute(
                      'data-child-navigation-type',
                      String(event.navigationType)
                    );
                  },
                  { once: true }
                );
                childWindow.navigation.oncurrententrychange = (event) => {
                  childPropertyOrder.push('child-property-currententrychange');
                  queueMicrotask(() => {
                    childPropertyOrder.push(
                      'child-property-currententrychange-microtask:' +
                        childWindow.location.hash +
                        ':' +
                        String(childWindow.history.state?.step ?? 'null')
                    );
                  });
                  document.body.setAttribute(
                    'data-child-property-from-url',
                    event.from?.url ?? 'null'
                  );
                  document.body.setAttribute(
                    'data-child-property-navigation-type',
                    String(event.navigationType)
                  );
                };
                childWindow.removeEventListener('hashchange', onHashchange);
                childWindow.addEventListener(
                  'hashchange',
                  () => {
                    setTimeout(() => {
                      document.body.setAttribute('data-top-order', topOrder.join(','));
                      document.body.setAttribute(
                        'data-top-currententrychange',
                        String(topCurrentEntryChanges)
                      );
                      document.body.setAttribute('data-child-order', childOrder.join(','));
                      document.body.setAttribute(
                        'data-child-property-order',
                        childPropertyOrder.join(',')
                      );
                      document.body.setAttribute(
                        'data-child-timeout-hash',
                        childWindow.location.hash
                      );
                      document.body.setAttribute(
                        'data-child-timeout-state',
                        String(childWindow.history.state?.step ?? 'null')
                      );
                      document.body.setAttribute('data-child-traversal-complete', 'true');
                    }, 0);
                  },
                  { once: true }
                );
                childWindow.history.go(1);
                document.body.setAttribute('data-child-sync-hash', childWindow.location.hash);
                document.body.setAttribute(
                  'data-child-sync-state',
                  String(childWindow.history.state?.step ?? 'null')
                );
              },
              { once: false }
            );

            childWindow.history.back();
          }, 50);
        },
        { once: true }
      );
    </script>
  </body>
</html>
