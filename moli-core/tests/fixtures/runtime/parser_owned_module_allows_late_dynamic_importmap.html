<!doctype html>
<html>
  <body>
    <script type="importmap">
      {
        "imports": {
          "first": "/assets/importmap-initial-target.mjs"
        }
      }
    </script>
    <script type="module">
      import { greeting } from "first";
      window.parserModuleAcquisitionFirstGreeting = greeting;
    </script>
    <script>
      window.parserModuleAcquisitionLateErrors = 0;
      window.addEventListener("error", () => {
        window.parserModuleAcquisitionLateErrors += 1;
      });

      const lateMap = document.createElement("script");
      lateMap.type = "importmap";
      lateMap.textContent =
        '{"imports":{"late":"/assets/importmap-extra-target.mjs"}}';
      document.body.appendChild(lateMap);

      const lateModule = document.createElement("script");
      lateModule.type = "module";
      lateModule.textContent =
        'import { label } from "late"; window.parserModuleAcquisitionLateLabel = label;';
      document.body.appendChild(lateModule);

      window.parserModuleAcquisitionMutationDone = true;
    </script>
  </body>
</html>
