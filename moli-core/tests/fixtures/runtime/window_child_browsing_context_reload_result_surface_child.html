<!doctype html>
<html>
  <body>
    <script>
      const count = Number(sessionStorage.getItem("childReloadCount") || "0");
      sessionStorage.setItem("childReloadCount", String(count + 1));
      parent.document.body.setAttribute("data-count", String(count + 1));
      let currentEntryChanges = 0;
      let propertyCurrentEntryChanges = 0;
      parent.document.body.setAttribute("data-child-currententrychange", "0");
      parent.document.body.setAttribute("data-child-property-currententrychange", "0");
      navigation.addEventListener("currententrychange", () => {
        currentEntryChanges += 1;
        parent.document.body.setAttribute(
          "data-child-currententrychange",
          String(currentEntryChanges)
        );
      });
      navigation.oncurrententrychange = () => {
        propertyCurrentEntryChanges += 1;
        parent.document.body.setAttribute(
          "data-child-property-currententrychange",
          String(propertyCurrentEntryChanges)
        );
      };
      parent.document.body.setAttribute(
        "data-child-activation",
        [
          String(navigation.activation?.entry?.url ?? ""),
          String(navigation.activation?.from?.url ?? ""),
          String(navigation.activation?.navigationType ?? ""),
        ].join("|")
      );
      if (count === 0) {
        let committedSettled = false;
        let finishedSettled = false;
        const beforeEntry = navigation.currentEntry;
        // Native history capture must not read author-shadowed activation fields.
        let activationReads = 0;
        const activation = navigation.activation;
        if (activation) {
          for (const name of ["entry", "from", "navigationType"]) {
            Object.defineProperty(activation, name, {
              configurable: true,
              get() { activationReads++; throw new Error("author activation " + name); },
            });
          }
        }
        const result = navigation.reload();
        parent.document.body.setAttribute("data-activation-reads", String(activationReads));
        parent.document.body.setAttribute(
          "data-sync-shape",
          [
            Object.keys(result).join(","),
            Object.getOwnPropertyNames(result).join(","),
            String(typeof result?.committed?.then === "function"),
            String(typeof result?.finished?.then === "function"),
          ].join("|")
        );
        parent.document.body.setAttribute(
          "data-sync-settled",
          String(committedSettled) + "," + String(finishedSettled)
        );
        parent.document.body.setAttribute(
          "data-sync-snapshot",
          [
            String(beforeEntry === navigation.currentEntry),
            String(currentEntryChanges),
            String(propertyCurrentEntryChanges),
          ].join("|")
        );
        result.committed.then((entry) => {
          committedSettled = true;
          parent.document.body.setAttribute(
            "data-committed-shape",
            [
              Object.prototype.toString.call(entry),
              String(entry?.url ?? ""),
              String(entry === navigation.currentEntry),
              String(entry === beforeEntry),
              String(currentEntryChanges),
              String(propertyCurrentEntryChanges),
            ].join("|")
          );
        });
        result.finished.then((entry) => {
          finishedSettled = true;
          parent.document.body.setAttribute(
            "data-finished-shape",
            [
              Object.prototype.toString.call(entry),
              String(entry?.url ?? ""),
              String(entry === navigation.currentEntry),
              String(entry === beforeEntry),
              String(currentEntryChanges),
              String(propertyCurrentEntryChanges),
            ].join("|")
          );
        });
      }
    </script>
  </body>
</html>
