<div class="case" style="height:200px"><span><div id="percentage-relative-block" class="block" style="position:relative;top:50%;height:40px" data-rect="[0,100,100,40]"></div></span></div>
<script>
  function collectInlineFragmentChecks() {
    return Array.from(document.querySelectorAll('[data-rect], [data-rects], [data-offsets]')).flatMap(element => {
      const origin = element.closest('.case').getBoundingClientRect();
      const rect = r => [r.x-origin.x, r.y-origin.y, r.width, r.height];
      const checks = [];
      if (element.hasAttribute('data-rect')) checks.push({id:element.id, actual:rect(element.getBoundingClientRect()), expected:JSON.parse(element.dataset.rect)});
      if (element.hasAttribute('data-rects')) checks.push({id:element.id+'.rects', actual:Array.from(element.getClientRects(), rect), expected:JSON.parse(element.dataset.rects)});
      if (element.hasAttribute('data-offsets')) checks.push({id:element.id+'.offsets', actual:[element.offsetLeft, element.offsetTop, element.offsetWidth, element.offsetHeight], expected:JSON.parse(element.dataset.offsets)});
      return checks;
    });
  }
</script>
