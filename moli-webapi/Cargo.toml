[package]
license.workspace = true
name = "moli-webapi"
version = "0.1.0"
edition = "2024"

[dependencies]
brotlic = "0.8.2"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib"] }
moli-streams = { path = "../moli-streams" }
moli-file-api = { path = "../moli-file-api" }
encoding_rs = "0.8"
parking_lot = "0.12"
moli-websocket-types = { path = "../moli-types/moli-websocket-types" }
moli-indexeddb-types = { path = "../moli-types/moli-indexeddb-types" }
base64 = "0.22"
moli-browser-profile = { path = "../moli-browser-profile" }
moli-time = { path = "../moli-time" }
moli-web-mime = { path = "../moli-web-mime" }
http = "1"
serde_json = "1.0.145"
moli-fetch-types = { path = "../moli-types/moli-fetch-types" }
anyhow = "1.0.100"
moli-url = { path = "../moli-url" }
moli-webidl-callback = { path = "../moli-webidl-callback" }
cssparser = "0.38"
half = { version = "2.7.1", default-features = false }
stylo = "0.22"
moli-web-errors = { path = "../moli-web-errors" }
moli-canvas = { path = "../moli-canvas" }
moli-geometry = { path = "../moli-geometry" }
moli-svg = { path = "../moli-svg" }
moli-v8-util = { path = "../moli-v8-util" }
moli-webapi-declare = { path = "../moli-webapi-declare" }
moli-webidl = { path = "../moli-webidl" }
strum = { version = "0.28", features = ["derive"] }
v8 = "152.2.0"
webrtc-sdp = "0.3.15"
url = "2.5.7"

[dev-dependencies]
fastrand = "2.3.0"
moli-v8-test-util = { path = "../moli-v8-test-util" }

[lints]
workspace = true
