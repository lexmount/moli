    "moli-bounded-json",
    "moli-broadcast-channel",
    "moli-browser-profile",
    "moli-canvas",
    "moli-charset-parser",
    "moli-cookie-cache",
    "moli-cookie-import",
    "moli-protocol-cdp",
    "moli-cookie-store",
    "moli-content-type",
    "moli-css-parse",
    "moli-csp",
    "moli-crypto",
    "moli-curl",
    "moli-dns-resolver",
    "moli-disk-pool",
    "moli-protocol",
    "moli-encoding",
    "moli-encoding-detector",
    "moli-core",
    "moli-import-map",
    "moli-image",
    "moli-indexeddb",
    "moli-local-executor",
    "moli-media",
    "moli-layout",
    "moli-leveldb-parser",
    "moli-message-port",
    "moli-multipart",
    "moli-xpath",
    "moli-module-script-tree",
    "moli-module-syntax",
    "moli-owner-queue",
    "moli-opfs",
    "moli-dom",
    "moli-parser",
    "moli-paint",
    "moli-page-types",
    "moli-parkable-image",
    "moli-process-signal",
    "moli-renderer-v8",
    "moli-robots",
    "moli-protocol-server",
    "moli-script",
    "moli-selector",
    "moli-session-history",
    "moli-site",
    "moli-shared-worker",
    "moli-storage-service",
    "moli-storage-key",
    "moli-sqlite",
    "moli-streams",
    "moli-structured-clone",
    "moli-stylesheet-blocking",
    "moli-svg",
    "moli-system-fonts",
    "moli-test-support",
    "moli-url",
    "moli-url-policy",
    "moli-v8-init",
    "moli-v8-platform",
    "moli-v8-test-util",
    "moli-v8-util",
    "moli-web-mime",
    "moli-web-bot-auth",
    "moli-web-errors",
    "moli-protocol-webdriver-bidi",
    "moli-protocol-webdriver-classic",
    "moli-webcrypto",
    "moli-webapi-declare",
    "moli-webapi-declare-derive",
    "moli-webidl",
    "moli-webidl-callback",
    "moli-webidl-derive",
    "moli-webmcp",
    "moli-cookie-jar",
    "moli-websocket",
    "moli-fetch",
    "moli-file-api",
    "moli-geometry",
    "moli-header-field",
    "moli-history",
    "moli-html-input-type",
    "moli-html2md",
    "moli-html-input-temporal",
    "moli-window-features",
    "moli-time",
    "moli-trace",
    "moli-http-cache",
    "moli-wpt-compat"
]
exclude = ["vendor/html5ever-0.40.1", "vendor/url-2.5.8", "vendor/urlpattern-0.6.0", "vendor/shiguredo_libvpx-2026.1.0"]

[workspace.package]
license = "MIT OR Apache-2.0"

[patch.crates-io]
# Share glyph preparation between CPU rendering and PDF ink measurement.
glifo = { git = "https://github.com/ldm0/vello", rev = "1f3376b102ca9a0950221f3df09316c4ef1299ba" }
vello_common = { git = "https://github.com/ldm0/vello", rev = "1f3376b102ca9a0950221f3df09316c4ef1299ba" }
# Share AWS-LC 0.46 with aws-lc-rs until upstream openssl-sys updates its backend.
openssl-sys = { git = "https://github.com/lexmount/rust-openssl", rev = "4497b245b09660f838dd00750616929b4cfe52ba" }
shiguredo_libvpx = { path = "vendor/shiguredo_libvpx-2026.1.0" }
parley = { git = "https://github.com/lexmount/parley", rev = "a18cfc3ba6638d44ff0d0c9ce7b0b3396b42e8cf" }
fontique = { git = "https://github.com/lexmount/parley", rev = "a18cfc3ba6638d44ff0d0c9ce7b0b3396b42e8cf" }
# Share fontations between shaping, raster rendering and PDF font subsetting.
subsetter = { git = "https://github.com/lexmount/subsetter", rev = "8d3815245835af309559c3b4a872d6a0a54913a9" }
url = { path = "vendor/url-2.5.8" }
urlpattern = { path = "vendor/urlpattern-0.6.0" }
idna = { git = "https://github.com/lexmount/rust-url", rev = "ca9fcad2b99f20c30c28a618ad78410f6fd31161" }
html5ever = { path = "vendor/html5ever-0.40.1" }
xml5ever = { git = "https://github.com/lexmount/html5ever", rev = "4574311c63e79bba7d4ddb98cb0562d8dad499ee" }
curl = { git = "https://github.com/lexmount/curl-rust", rev = "0392e12475d8d1160d4cae07c172cac02797cc25" }
curl-sys = { path = "vendor/curl-sys-0.4.91" }
cookie = { git = "https://github.com/ldm0/cookie-rs", branch = "priority" }
v8 = { path = "vendor/v8-152.2.0" }
deno_v8 = { path = "vendor/deno_v8-0.3.0" }
selectors = { git = "https://github.com/lexmount/stylo", rev = "2fe93b20d5ba764842071c2290d0281805d80656" }
servo_arc = { git = "https://github.com/lexmount/stylo", rev = "2fe93b20d5ba764842071c2290d0281805d80656" }
stylo = { git = "https://github.com/lexmount/stylo", rev = "2fe93b20d5ba764842071c2290d0281805d80656" }
stylo_atoms = { git = "https://github.com/lexmount/stylo", rev = "2fe93b20d5ba764842071c2290d0281805d80656" }
stylo_dom = { git = "https://github.com/lexmount/stylo", rev = "2fe93b20d5ba764842071c2290d0281805d80656" }
stylo_static_prefs = { git = "https://github.com/lexmount/stylo", rev = "2fe93b20d5ba764842071c2290d0281805d80656" }
stylo_traits = { git = "https://github.com/lexmount/stylo", rev = "2fe93b20d5ba764842071c2290d0281805d80656" }
svgtypes = { git = "https://github.com/lexmount/svgtypes", branch = "moli" }
taffy = { git = "https://github.com/ldm0/taffy", rev = "0a337871fa44db7d48571b06668f92737eefa8c2" }

[patch."https://github.com/DioxusLabs/taffy"]
taffy = { git = "https://github.com/ldm0/taffy", rev = "0a337871fa44db7d48571b06668f92737eefa8c2" }

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
enum_variant_names = "allow"
result_unit_err = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = false
# Production and release-regression binaries favor a compact code working set
# over parallel code generation.
codegen-units = 1

[profile.test]
debug = 1

[patch."https://github.com/lexmount/curl-rust"]
curl-sys = { path = "vendor/curl-sys-0.4.91" }
