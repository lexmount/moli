[workspace]
resolver = "3"
members = [
    "moli",
    "moli-action-window",
    "moli-bounded-buffer",
    "moli-bounded-json",
    "moli-broadcast-channel",
    "moli-browser-profile",
    "moli-canvas",
    "moli-charset-parser",
    "moli-cookie-cache",
    "moli-protocol-cdp",
    "moli-cookie-store",
    "moli-content-type",
    "moli-css-parse",
    "moli-crypto",
    "moli-curl",
    "moli-dns-resolver",
    "moli-protocol",
    "moli-encoding",
    "moli-encoding-detector",
    "moli-core",
    "moli-import-map",
    "moli-image",
    "moli-indexeddb",
    "moli-local-executor",
    "moli-layout",
    "moli-message-port",
    "moli-multipart",
    "moli-xpath",
    "moli-module-script-tree",
    "moli-module-syntax",
    "moli-owner-queue",
    "moli-opfs",
    "moli-dom",
    "moli-parser",
    "moli-paint",
    "moli-page-types",
    "moli-process-signal",
    "moli-renderer-v8",
    "moli-robots",
    "moli-protocol-server",
    "moli-script",
    "moli-selector",
    "moli-site",
    "moli-shared-worker",
    "moli-storage-service",
    "moli-storage-key",
    "moli-streams",
    "moli-structured-clone",
    "moli-stylesheet-blocking",
    "moli-svg",
    "moli-test-support",
    "moli-url",
    "moli-url-policy",
    "moli-v8-init",
    "moli-v8-platform",
    "moli-v8-test-util",
    "moli-v8-util",
    "moli-web-mime",
    "moli-web-bot-auth",
    "moli-web-errors",
    "moli-protocol-webdriver-bidi",
    "moli-protocol-webdriver-classic",
    "moli-webcrypto",
    "moli-webapi-declare",
    "moli-webapi-declare-derive",
    "moli-webidl",
    "moli-webidl-callback",
    "moli-webidl-derive",
    "moli-cookie-jar",
    "moli-websocket",
    "moli-fetch",
    "moli-file-api",
    "moli-geometry",
    "moli-header-field",
    "moli-html-input-temporal",
    "moli-time",
    "moli-trace",
    "moli-http-cache",
    "moli-wpt-compat"
]
exclude = ["vendor/xml5ever-0.39.0"]

[workspace.package]
license = "MIT OR Apache-2.0"

[patch.crates-io]
xml5ever = { path = "vendor/xml5ever-0.39.0" }
curl = { git = "https://github.com/ldm0/curl-rust", branch = "moli" }
curl-sys = { git = "https://github.com/ldm0/curl-rust", branch = "moli" }
cookie = { git = "https://github.com/ldm0/cookie-rs", branch = "priority" }
v8 = { path = "vendor/v8-152.2.0" }
deno_v8 = { path = "vendor/deno_v8-0.3.0" }
selectors = { git = "https://github.com/ldm0/stylo", rev = "671d13d31b3b00e7b1e0088ba2b36a4e35c0858c" }
servo_arc = { git = "https://github.com/ldm0/stylo", rev = "671d13d31b3b00e7b1e0088ba2b36a4e35c0858c" }
stylo = { git = "https://github.com/ldm0/stylo", rev = "671d13d31b3b00e7b1e0088ba2b36a4e35c0858c" }
stylo_atoms = { git = "https://github.com/ldm0/stylo", rev = "671d13d31b3b00e7b1e0088ba2b36a4e35c0858c" }
stylo_dom = { git = "https://github.com/ldm0/stylo", rev = "671d13d31b3b00e7b1e0088ba2b36a4e35c0858c" }
stylo_static_prefs = { git = "https://github.com/ldm0/stylo", rev = "671d13d31b3b00e7b1e0088ba2b36a4e35c0858c" }
stylo_traits = { git = "https://github.com/ldm0/stylo", rev = "671d13d31b3b00e7b1e0088ba2b36a4e35c0858c" }
taffy = { git = "https://github.com/ldm0/taffy", rev = "71bc149ce5358406cdabba66da853ceb11ac74ee" }

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
enum_variant_names = "allow"
result_unit_err = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = false
# Production and release-regression binaries favor a compact code working set
# over parallel code generation.
codegen-units = 1

[profile.test]
debug = 1
