<!doctype html>
<style>
  body { margin: 0; font: 20px/32px sans-serif; }
  p { margin: 16px; }
  .atomic { display: inline-block; border: 4px solid; padding: 10px; overflow: hidden; }
  input { box-sizing: border-box; width: 160px; height: 48px; border: 6px solid; padding: 8px; }
</style>
<p><label id="input-label">Customer name: <input id="input" value="hello"></label></p>
<p><label id="span-label">Before <span id="atomic" class="atomic"><span id="inner">nested text</span></span> after</label></p>
<p><label id="nested-label">Before <span id="outer-atomic" class="atomic"><span id="inner-atomic" class="atomic"><span id="nested-inner">nested text</span></span></span> after</label></p>
<p><label style="background: red">Before <span id="atomic-block" class="atomic" style="width: 100px; height: 60px; background: blue"><span id="block-child" style="display: block; width: 40px; height: 20px; background: lime"></span></span> after</label></p>
