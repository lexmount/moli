[project]
name = "moli-frontend-smoke"
version = "0.1.0"
description = "React, Vue, and Angular DOM differential smoke tests for Moli"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "tinycss2>=1.5,<2",
  "websockets>=15,<16",
]

[project.scripts]
moli-frontend-smoke = "moli_frontend_smoke.runner:main"
moli-frontend-smoke-analyze = "moli_frontend_smoke.analysis:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moli_frontend_smoke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
