[package]
name = "moli-video"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
media-ext = [
    "dep:anyhow",
    "dep:bytes",
    "dep:coreaudio-rs",
    "dep:moli-image",
    "dep:moli-web-mime",
    "dep:objc2-core-audio",
    "dep:parking_lot",
    "dep:rsmpeg",
    "dep:symphonia",
]

[target.'cfg(all(any(target_os = "linux", target_os = "macos"), target_pointer_width = "64"))'.dependencies]
anyhow = { version = "1.0.100", optional = true }
bytes = { version = "1", optional = true }
moli-image = { path = "../moli-image", optional = true }
moli-web-mime = { path = "../moli-web-mime", optional = true }
parking_lot = { version = "0.12", optional = true }
rsmpeg = { git = "https://github.com/lexmount/rsmpeg", rev = "a9fb542d8e2f0ca45e5d53ebe7a5033bb6487d2e", default-features = false, features = ["bundled_h264"], optional = true }
symphonia = { version = "0.6.1", default-features = false, features = ["aac"], optional = true }

[target.'cfg(all(target_os = "macos", target_pointer_width = "64"))'.dependencies]
coreaudio-rs = { version = "0.14.2", default-features = false, features = ["audio_unit"], optional = true }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["HostTime"], optional = true }

[lints]
workspace = true
