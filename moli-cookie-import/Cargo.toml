[package]
license.workspace = true
name = "moli-cookie-import"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
moli-browser-profile = { path = "../moli-browser-profile" }
moli-cookie-cache = { path = "../moli-cookie-cache" }
moli-cookie-jar = { path = "../moli-cookie-jar" }
moli-crypto = { path = "../moli-crypto" }
moli-leveldb-parser = { path = "../moli-leveldb-parser" }
# Keep imports self-contained; .cargo/config.toml trims unused SQLite C extensions.
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
snap = "1.1.1"
tempfile = "3.23.0"
time = "0.3.44"

[dev-dependencies]
# Generate real LevelDB fixtures and compare the read-only importer with the engine.
rusty-leveldb = "4.0.1"

[lints]
workspace = true
