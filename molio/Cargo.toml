[package]
name = "molio"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
gpui = { package = "gpui-ce", git = "https://github.com/lexmount/gpui-ce", rev = "1d433ddc675f9946ca91e0c705e4bc9b0360a78c" }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/lexmount/gpui-ce", rev = "1d433ddc675f9946ca91e0c705e4bc9b0360a78c", features = ["wayland", "x11"] }
moli-core = { path = "../moli-core", features = ["molio"] }
moli-web-mime = { path = "../moli-web-mime" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "sync", "time"] }
unicode-segmentation = "1.12"
url = "2.5.7"
