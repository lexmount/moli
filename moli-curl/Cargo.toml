[package]
license.workspace = true
name = "moli-curl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
cidr = "0.3.2"
crossbeam-channel = "0.5.15"
curl = { version = "0.4.51", default-features = false, features = ["apple-sectrust", "brotli", "browser-response-headers", "http2", "poll_7_68_0", "ssl", "static-curl", "websocket"] }
curl-sys = { version = "0.4.91", default-features = false }
moli-header-field = { path = "../moli-header-field" }
moli-dns-resolver = { path = "../moli-dns-resolver" }
openssl-sys = { version = "0.9", features = ["aws-lc"] }
parking_lot = "0.12"
tracing = "0.1.41"
tokio = { version = "1.51.0", features = ["sync"] }
url = "2.5.7"

[dev-dependencies]
h2 = "0.4"
http = "1"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tempfile = "3"
tokio = { version = "1.51.0", features = ["io-util", "macros", "net", "rt", "time"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tracing-subscriber = { version = "0.3.19", features = ["fmt"] }

[lints]
workspace = true
